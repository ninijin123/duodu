/* =========================================================
   Multi-device sync (Netlify function /api/sync + Netlify Blobs)
   ========================================================= */
var SYNC={busy:false,last:0,err:"",timer:null,muted:false,lastMeta:"",
  norm(c){const x=String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");return x.length>=12?(x.match(/.{1,4}/g)||[]).join("-"):String(c||"").trim()},
  DEFAULT:"RRDQ-4QF3-7XZA-2EFU",
  code(){let v="";try{v=localStorage.getItem("duodu.sync")||""}catch(e){} if(v==="off") return ""; return this.norm(v||this.DEFAULT)},
  isDefault(){let v="";try{v=localStorage.getItem("duodu.sync")||""}catch(e){} return !v},
  setCode(c){try{c?localStorage.setItem("duodu.sync",c):localStorage.removeItem("duodu.sync")}catch(e){}},
  newCode(){const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(16));
    return [0,1,2,3].map(g=>[0,1,2,3].map(i=>A[r[g*4+i]%A.length]).join("")).join("-")},
  dirty(){if(!this.code()||this.muted)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),4000)},
  async api(method,q,body){
    let r; try{r=await fetch("/api/sync"+(q||""),{method,headers:{"x-sync-code":this.code(),"content-type":"application/json"},body})}
    catch(e){throw new Error("没有网络，联网后会自动同步")}
    if(r.status===404) throw new Error("同步服务还没部署好（需要通过 GitHub 部署网站）");
    if(!r.ok){let m="";try{m=(await r.json()).error}catch(e){}throw new Error(m||"同步出错（"+r.status+"）")}
    return r;
  },
  metaOut(){return {settings:{...S.settings,voices:undefined,mtKey:undefined},settingsU:S.settingsU||0,vocab:S.vocab,vocabDel:S.vocabDel||[],pos:S.pos,diary:S.diary||[],study:S.study||{days:[]},newDay:S.newDay||null,bookDel:S.bookDel||[]}},
  mergeMeta(R){
    if(!R) return;

      document.documentElement.style.setProperty("--fs",S.settings.fs+"px")}
    const del={}; [...(S.vocabDel||[]),...(R.vocabDel||[])].forEach(d=>{if(!del[d.id]||d.t>del[d.id])del[d.id]=d.t});
    S.vocabDel=Object.entries(del).map(([id,t])=>({id,t})).slice(-3000);
    const map={}; S.vocab.forEach(v=>map[v.id]=v);
    (R.vocab||[]).forEach(r=>{const l=map[r.id];if(!l||tu(r)>tu(l))map[r.id]=r});
    S.vocab=Object.values(map).filter(v=>!(del[v.id]&&del[v.id]>=tu(v))).sort((a,b)=>(b.t||0)-(a.t||0));
    Object.entries(R.pos||{}).forEach(([id,p])=>{const l=S.pos[id];if(!l||(p.t||0)>(l.t||0))S.pos[id]=p});
    const dm={}; (S.diary||[]).forEach(d=>dm[d.date]=d); (R.diary||[]).forEach(d=>{const l=dm[d.date];if(!l||(d.u||0)>(l.u||0))dm[d.date]=d});
    S.diary=Object.values(dm).sort((a,b)=>a.date<b.date?-1:1);
    S.study={days:[...new Set([...((S.study||{}).days||[]),...((R.study||{}).days||[])])].sort().slice(-400)};
    if(R.newDay){const l=S.newDay;if(!l||R.newDay.date>l.date)S.newDay=R.newDay;else if(R.newDay.date===l.date)S.newDay={date:l.date,n:Math.max(l.n||0,R.newDay.n||0),extra:Math.max(l.extra||0,R.newDay.extra||0)}}
    const bd={}; [...(S.bookDel||[]),...(R.bookDel||[])].forEach(d=>{if(!bd[d.id]||d.t>bd[d.id])bd[d.id]=d.t});
    S.bookDel=Object.entries(bd).map(([id,t])=>({id,t})).slice(-500);
  },
  async run(){
    if(!this.code()||this.busy) return;
    this.busy=true; this.muted=true; this.err=""; this.paint();
    let changedView=false; const before=JSON.stringify([S.vocab.length,USER.length]);
    try{
      const idx=await (await this.api("GET","")).json();
      this.mergeMeta(idx.meta); save();
      const remote=idx.books||{};
      for(const [id,r] of Object.entries(remote)){
        const l=USER.find(b=>b.id===id);
        if(r.deleted){ if(l&&(l.updated||0)<=r.updated){await DB.del(id,true);USER=USER.filter(b=>b.id!==id);changedView=true} continue }
        if(!l||(r.updated||0)>(l.updated||0)){
          const bk=await (await this.api("GET","?book="+encodeURIComponent(id))).json();
          if(bk&&bk.id){await DB.put(bk,true);USER=USER.filter(b=>b.id!==id).concat(bk);
            Object.keys(cache).forEach(k=>{if(k.startsWith(id+":"))delete cache[k]});
            if(view.book&&view.book.id===id){view.book=bk} changedView=true}
        }
      }
      const pushed=new Set();
      for(const b of USER){const r=remote[b.id]; if(!r||r.deleted&&!(S.bookDel||[]).some(d=>d.id===b.id)||(!r.deleted&&(b.updated||0)>(r.updated||0))){await this.api("PUT","?book="+encodeURIComponent(b.id),JSON.stringify(b));pushed.add(b.id)}}
      for(const d of (S.bookDel||[])){const r=remote[d.id]; if(r&&!r.deleted&&r.updated<=d.t) await this.api("DELETE","?book="+encodeURIComponent(d.id))}
      const m=JSON.stringify(this.metaOut());
      if(m!==this.lastMeta){await this.api("PUT","",m);this.lastMeta=m}
      this.last=Date.now();
      this.info={cloud:new Set([...Object.keys(remote).filter(k=>!remote[k].deleted),...pushed]).size,local:USER.length,words:S.vocab.length};
      if(JSON.stringify([S.vocab.length,USER.length])!==before) changedView=true;
    }catch(e){this.err=e.message||String(e)}
    this.busy=false; this.muted=false; this.paint();
    if(changedView&&view.sheet&&view.sheet.type==="settings") renderSheet();
    if(changedView&&!view.sheet){ if(view.name==="lib") renderLib(); else if(view.name==="reader"&&view.book&&USER.some(b=>b.id===view.book.id)) keepScroll(render); else {view={name:"lib",book:null,ch:0,active:-1,sheet:null};render()} }
  },
  status(){
    if(!this.code()) return "";
    const inf=this.info?`（云端 ${this.info.cloud} 本书 · 本机 ${this.info.local} 本 · 生词 ${this.info.words} 个）`:"";
    if(this.busy) return "正在同步…";
    if(this.err) return "同步失败："+this.err;
    if(this.last){const d=new Date(this.last);return `已同步 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`+(view.sheet&&view.sheet.type==="settings"?inf:"")}
    return "等待同步";
  },
  paint(){document.querySelectorAll("[data-sync-stat]").forEach(x=>x.textContent=this.status())}
};

async function defineWord(word,sentence,from,to){
  const st=S.settings;
  const toName=LANGS[to].name;
  const sys=`You are a concise dictionary for a language learner. Explain the word as it is used in the given sentence. Answer in ${toName}, exactly eight lines, nothing else:
音标|IPA pronunciation, e.g. /ˈklɒk/
词性|part of speech in ${toName}, short (e.g. 名词, 动词)
意思|its meaning in this sentence, in ${toName}, under 20 characters
原形|dictionary form of the word (same word if already base form)
例句|one short, natural example sentence in ${LANGS[from].name} using the word with the same meaning (not the given sentence)${(S.settings.life||"").trim()?", set in the learner's own daily life: "+S.settings.life.trim().slice(0,200):""}
例译|translation of that example sentence into ${toName}
用法|exactly one of: 日常常用 / 书面正式 / 文学少见 (how often a native speaker would use this word in everyday life)
搭配|2–3 common collocations with this word, separated by "; "`;
  const text=await llm([{role:"system",content:sys},{role:"user",content:`Word: ${word}\nLanguage: ${LANGS[from].name}\nSentence: ${sentence}`}],450,.5);
  const o={};
  text.split("\n").forEach(l=>{const m=l.match(/^\s*(音标|词性|意思|原形|例句|例译|用法|搭配)\s*[|｜:：]\s*(.*)$/);if(m)o[m[1]]=m[2].trim()});
  if(!o["意思"]) o["意思"]=text.trim().slice(0,60);
  return {ipa:o["音标"]||"",pos:o["词性"]||"",mean:o["意思"]||"",base:o["原形"]||"",ex:o["例句"]||"",exTr:o["例译"]||"",level:o["用法"]||"",col:o["搭配"]||""};
}
function placePop(pop,el){

  let top=r.bottom+window.scrollY+8;
  if(r.bottom+ph+20>window.innerHeight && r.top-ph-8>70) top=r.top+window.scrollY-ph-8;

}

    el.querySelectorAll("[data-try]").forEach(x=>x.onclick=()=>{const c=x.dataset.try;synth&&synth.cancel();
      utter({en:"It was a bright cold day in April, and the clocks were striking thirteen.",zh:"四月里一个晴朗而寒冷的日子，时钟正敲了十三下。",ru:"Был яркий холодный апрельский день, и часы били тринадцать."}[c],c)});
    el.querySelector("#mtBase").oninput=e=>{S.settings.mtBase=e.target.value.trim();save()};
    el.querySelector("#mtKey").oninput=e=>{S.settings.mtKey=e.target.value.trim();save()};
    el.querySelector("#mtModel").oninput=e=>{S.settings.mtModel=e.target.value.trim();save()};
    el.querySelector("#mtTo").onchange=e=>{S.settings.mtTo=e.target.value;save()};
    el.querySelector("#mtAuto").onchange=e=>{S.settings.mtAuto=e.target.checked;save()};
    el.querySelector("#gl").oninput=e=>{S.settings.glossary=e.target.value;save()};
    el.querySelector("#life").oninput=e=>{S.settings.life=e.target.value;save()};
    el.querySelector("#qLevel").onchange=e=>{S.settings.qLevel=e.target.value;save()};
    const markSet=e=>{if(e.target.closest("[id^=sync]"))return;S.settingsU=Date.now()};
    el.addEventListener("input",markSet); el.addEventListener("change",markSet);
    const sq=id=>el.querySelector("#"+id);
    if(sq("syncNew")) sq("syncNew").onclick=()=>{SYNC.setCode(SYNC.newCode());S.settingsU=Date.now();save();renderSheet();SYNC.run()};
    if(sq("syncDef")) sq("syncDef").onclick=()=>{SYNC.setCode("");renderSheet();SYNC.run()};
    if(sq("syncOn")) sq("syncOn").onclick=()=>{SYNC.setCode("");renderSheet();SYNC.run()};
    if(sq("syncJoin")) sq("syncJoin").onclick=()=>{const c=SYNC.norm(sq("syncIn").value);if(c.replace(/-/g,"").length<16){toast("同步码不完整，应该是 16 个字母和数字");return}SYNC.setCode(c);renderSheet();SYNC.run().then(()=>{if(view.sheet&&view.sheet.type==="settings")renderSheet()})};
    if(sq("syncNow")) sq("syncNow").onclick=()=>SYNC.run();
    if(sq("syncLink")) sq("syncLink").onclick=()=>{const link=location.origin+location.pathname.replace(/index\.html$/,"")+"#join-"+SYNC.code().replace(/-/g,"");
      navigator.clipboard.writeText(link).then(()=>toast("已复制加入链接，发到其他设备上点开即可")).catch(()=>toast(link))};
    if(sq("syncCopy")) sq("syncCopy").onclick=()=>navigator.clipboard.writeText(SYNC.code()).then(()=>toast("已复制同步码")).catch(()=>toast("请长按同步码复制"));
    if(sq("syncOff")) sq("syncOff").onclick=()=>{SYNC.setCode("off");renderSheet();toast("这台设备已关闭同步，数据还在本机")};
    el.querySelectorAll("[data-trt]").forEach(b=>b.onclick=()=>{S.settings.trTone=b.dataset.trt;S.settingsU=Date.now();save();renderSheet();if(view.name==="reader")keepScroll(render)});
    el.querySelectorAll("[data-zhf]").forEach(b=>b.onclick=()=>{S.settings.zhFont=b.dataset.zhf;S.settingsU=Date.now();save();renderSheet();if(view.name==="reader")keepScroll(render)});
    el.querySelector("#newGoal").onchange=e=>{S.settings.newGoal=+e.target.value;save()};
    el.querySelector("#autoSay").onchange=e=>{S.settings.autoSay=e.target.checked;save()};
    el.querySelector("#mtTest").onclick=async()=>{const out=el.querySelector("#mtRes");out.textContent="测试中…";
      try{const r=await callMT(["It was a bright cold day in April, and the clocks were striking thirteen."],"","en",S.settings.mtTo==="en"?"zh":S.settings.mtTo);out.textContent="成功："+(r[0]||"(空)")}
      catch(e){out.textContent=e.message}};
  }

  if(FLOW.sheet(t,el,head)) return;
  if(t==="review"){ SB.render(el,head); return; }
  if(t==="vocab"){
    const pl=SB.plan(), left=pl.review.length+pl.fresh.length, mastered=S.vocab.filter(isMastered).length;
    el.innerHTML=`<div class="sheet">${head("生词本",S.vocab.length?`<button class="ibtn" id="copyV" title="复制全部">${ic("copy")}</button>`:"")}<div class="body">
      ${S.vocab.length?`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button class="btn" id="vDiary">${ic("pen")}今日小日记</button><button class="btn primary" id="startRv" ${left?"":"disabled style=\"opacity:.5\""}>${left?`开始今日学习（新 ${pl.fresh.length} · 复习 ${pl.review.length}）`:"今天的任务完成了"}</button><span class="note">共 ${S.vocab.length} 个 · 已掌握 ${mastered} 个</span></div>`:""}
      ${S.vocab.length?`<div class="vocab">${S.vocab.map(v=>`<div class="vitem">
        <div class="w ${cjk(v.lang)?"zh":""}" style="cursor:default">${esc(v.text)}</div>
        ${v.kind==="idea"?`<div class="ctx">${esc(v.mean||"")}</div>`:`${v.mean?`<div class="ctx" style="color:var(--jade)">${esc(v.mean)}${v.level?` <span class="lv ${/文学/.test(v.level)?"":"use"}">${esc(v.level)}</span>`:""}</div>`:""}${v.col?`<div class="ctx"><b>搭配</b> ${esc(v.col)}</div>`:""}`}
        ${v.kind==="word"&&v.ctx?`<div class="ctx"><b>原句</b> ${esc(v.ctx)}</div>`:""}
        ${v.tr&&v.kind!=="idea"?`<div class="ctx">${v.kind==="word"?"<b>译文</b> ":""}${esc(v.tr)}</div>`:""}
        ${v.ex?`<div class="ctx"><b>例句</b> ${esc(v.ex)}${v.exTr?`<br>${esc(v.exTr)}`:""}</div>`:""}
        <div class="foot"><span>${esc(v.book)}</span><span class="spacer"></span>
          <span class="tag">${nextLabel(v)}</span>
          ${v.kind==="idea"?"":`<a href="${dictURL(v.text,v.lang)}" target="_blank" rel="noopener">查词典</a>
          <button class="ibtn" data-say="${v.id}" aria-label="朗读">${ic("speakA")}</button>`}
          <button class="ibtn" data-rm="${v.id}" aria-label="删除">${ic("trash")}</button></div>
      </div>`).join("")}</div>`
      :`<p class="empty">还没有收藏。阅读时长按选中一个词，点底部的“收藏”；不选中直接点，会收藏整句。</p>`}
    </div></div>`;
    document.body.appendChild(el);
    el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.vocabDel=(S.vocabDel||[]).concat({id:b.dataset.rm,t:Date.now()});S.vocab=S.vocab.filter(v=>v.id!==b.dataset.rm);save();renderSheet();if(view.name==="lib")renderLib()});
    el.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{const v=S.vocab.find(x=>x.id===b.dataset.say); synth&&synth.cancel(); utter(v.text,v.lang)});
    const sr=el.querySelector("#startRv"); if(sr) sr.onclick=startReview;
    const vd=el.querySelector("#vDiary"); if(vd) vd.onclick=()=>openSheet("diary");
    const cp=el.querySelector("#copyV");
    if(cp) cp.onclick=()=>{const txt=S.vocab.map(v=>[v.text,v.mean||"",v.kind==="word"?v.ctx:"",v.tr||"",v.ex||"",v.exTr||""].join("\t")).join("\n");
      navigator.clipboard.writeText(txt).then(()=>toast("已复制，可以粘贴到 Anki 或表格")).catch(()=>toast("复制失败，请手动选择文字"))};
  }

  if(t==="import"){
    if(!IMP) IMP={tab:"file",la:"en",lb:"zh",A:null,B:null,map:null,title:"",title2:"",busy:""};
    const X=IMP;
    const fileBox=(side)=>{const d=X[side];return `<div class="drop">
      <label class="f">${side==="A"?"原文":"译文"}语言<select id="l${side}">${langOpts(side==="A"?X.la:X.lb)}</select></label>
      <div class="fn ${d?"":"muted"}">${d?`${esc(d.name)} · ${d.chapters.length} 章`:(side==="A"?"还没选择文件":"还没选择文件（可不选）")}</div>
      <label class="btn" style="width:max-content">选择 EPUB / TXT<input type="file" id="f${side}" accept=".epub,.txt,application/epub+zip,text/plain" hidden></label>
    </div>`};
    const pasteBox=(side)=>`<div style="display:flex;flex-direction:column;gap:8px;min-width:0">
      <label class="f">${side==="A"?"原文":"译文"}语言<select id="l${side}">${langOpts(side==="A"?X.la:X.lb)}</select></label>
      <textarea id="t${side}" placeholder="${side==="A"?"粘贴原文。带“Chapter 1 / 第一章 / Глава 1”这类标题会自动分章。":"粘贴译文（可留空）"}">${esc(X["paste"+side]||"")}</textarea>
    </div>`;
    let mapHTML="";
    if(X.A&&X.map){
      const bc=X.B?X.B.chapters:[];
      const opt=(sel)=>`<option value="-1" ${sel<0?"selected":""}>— 无译文 —</option>`+bc.map((c,j)=>`<option value="${j}" ${j===sel?"selected":""}>${j+1}. ${esc((c.t||c.text).slice(0,26))}</option>`).join("");
      mapHTML=`<div class="map">
        <div class="mrow head"><span></span><span>原文章节</span><span>对应译文</span></div>
        ${X.A.chapters.map((c,i)=>{const m=X.map[i];return `<div class="mrow ${m.on?"":"off"}">
          <input type="checkbox" data-on="${i}" ${m.on?"checked":""} aria-label="导入这一章">
          <span class="ta">${i+1}. ${esc(c.t||c.text.slice(0,30))} <small>${vlen(c.text).toLocaleString()} 字</small></span>
          ${bc.length?`<select data-map="${i}">${opt(m.j)}</select>`:""}
        </div>`}).join("")}
      </div>
      <p class="note">已按长度自动配好章节。前言、译者序这类只有一边有的部分可以取消勾选。章节内的段落和句子会在阅读时自动对齐。</p>`;
    }
    el.innerHTML=`<div class="sheet wide">${head("导入一本书")}<div class="body">
      <div class="tabs seg" role="tablist"><button data-tab="file" class="${X.tab==="file"?"on":""}">EPUB / TXT 文件</button><button data-tab="paste" class="${X.tab==="paste"?"on":""}">粘贴文本</button></div>
      <div class="files">${X.tab==="file"?fileBox("A")+fileBox("B"):pasteBox("A")+pasteBox("B")}</div>
      ${X.tab==="paste"?`<div><button class="btn" id="parsePaste">识别章节</button></div>`:""}
      ${X.busy?`<div class="busy">${esc(X.busy)}</div>`:""}
      ${X.A?`<div class="grid2">
        <label class="f">书名<input type="text" id="imT" value="${esc(X.title)}"></label>
        <label class="f">副标题（可选）<input type="text" id="imT2" value="${esc(X.title2)}"></label>
      </div>`:""}
      ${mapHTML}
      <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" data-close>取消</button><button class="btn primary" id="imGo" ${X.A?"":"disabled"} style="${X.A?"":"opacity:.5"}">加入书架</button></div>
    </div></div>`;
    document.body.appendChild(el);
    const $=id=>el.querySelector("#"+id);
    const keepFields=()=>{if($("imT"))X.title=$("imT").value;if($("imT2"))X.title2=$("imT2").value;if($("tA"))X.pasteA=$("tA").value;if($("tB"))X.pasteB=$("tB").value};
    const rerender=()=>{const sc=el.querySelector(".body").scrollTop;keepFields();renderSheet();const nb=document.querySelector("#sheet .body");if(nb)nb.scrollTop=sc};
    el.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{keepFields();X.tab=b.dataset.tab;X.A=null;X.B=null;X.map=null;rerender()});
    $("lA").onchange=e=>X.la=e.target.value; $("lB").onchange=e=>X.lb=e.target.value;
    const autoMap=()=>{
      if(!X.A){X.map=null;return}
      const A=X.A.chapters, B=X.B?X.B.chapters:[];
      X.map=A.map(c=>({on:vlen(c.text)>=300,j:-1}));
      if(B.length){
        for(const [i0,i1,j0,j1] of dpAlign(A.map(c=>vlen(c.text)),B.map(c=>vlen(c.text)),MOVES_CH))
          if(i1-i0===1&&j1-j0===1) X.map[i0]={on:true,j:j0};
      }
    };
    const loadFile=side=>async e=>{
      const f=e.target.files[0]; if(!f) return;
      keepFields(); X.busy=`正在读取 ${f.name}…`; rerender();
      try{
        const r=await readAnyFile(f,side==="A"?X.la:X.lb);
        if(!r.chapters.length) throw new Error("没有读到文字");
        X[side]={name:f.name,chapters:r.chapters};
        if(side==="A"&&!X.title) X.title=r.title||f.name.replace(/\.\w+$/,"");
        if(side==="B"&&!X.title2) X.title2=r.title||"";
        X.busy=""; autoMap();
      }catch(err){X.busy="读取失败："+(err.message||err)+"。如果是带 DRM 加密的 EPUB，无法读取。"}
      rerender();
    };
    if($("fA")) $("fA").onchange=loadFile("A");
    if($("fB")) $("fB").onchange=loadFile("B");
    if($("parsePaste")) $("parsePaste").onclick=()=>{
      keepFields();
      if(!X.pasteA||!X.pasteA.trim()){toast("请先粘贴原文");return}
      X.A={name:"粘贴的原文",chapters:splitChapters(X.pasteA)};
      X.B=X.pasteB&&X.pasteB.trim()?{name:"粘贴的译文",chapters:splitChapters(X.pasteB)}:null;
      autoMap(); X.map.forEach(m=>m.on=true); rerender();
    };
    el.querySelectorAll("[data-on]").forEach(c=>c.onchange=()=>{X.map[+c.dataset.on].on=c.checked;c.closest(".mrow").classList.toggle("off",!c.checked)});
    el.querySelectorAll("[data-map]").forEach(s=>s.onchange=()=>{X.map[+s.dataset.map].j=+s.value});
    $("imGo").onclick=async()=>{
      if(!X.A) return; keepFields();
      const chapters=X.A.chapters.map((c,i)=>({c,m:X.map[i]})).filter(x=>x.m.on).map(x=>({t:x.c.t,a:x.c.text,b:(X.B&&x.m.j>=0)?X.B.chapters[x.m.j].text:""}));
      if(!chapters.length){toast("至少勾选一章");return}
      const hasB=chapters.some(c=>c.b);
      const bk={id:"u"+Date.now().toString(36),title:X.title.trim()||"未命名",title2:X.title2.trim(),la:X.la,lb:hasB?X.lb:null,color:USER.length+1,added:Date.now(),chapters};
      const ok=await DB.put(bk);
      USER.push(bk); IMP=null; closeSheet();
      toast(ok?"已加入书架":"已打开，但这台设备无法长期保存（浏览器存储不可用）");
      openBook(bk.id);
    };
  }

  if(t==="confirm"){
    el.innerHTML=`<div class="sheet">${head("删除这本书？")}<div class="body">
      <p>「${esc(view.sheet.title)}」会从这台设备上删除，阅读进度也会一起删掉。生词本里的内容保留。</p>
      <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" data-close>取消</button><button class="btn" id="doDel" style="color:var(--danger);border-color:var(--danger)">删除</button></div>
    </div></div>`;
    document.body.appendChild(el);
    el.querySelector("#doDel").onclick=async()=>{const id=view.sheet.id;await DB.del(id);USER=USER.filter(b=>b.id!==id);delete S.pos[id];save();closeSheet();renderLib()};
  }
  el.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
}

function render(){closePop(); view.name==="lib"?renderLib():renderReader(); if(view.sheet) renderSheet()}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&view.sheet) closeSheet();
  if(view.name!=="reader"||view.sheet||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const n=pairsOf(view.book,view.ch).length;
  if(e.key==="ArrowDown"||e.key==="j"){e.preventDefault();setActive(Math.min(n-1,view.active+1));app.querySelector(".row.active")?.scrollIntoView({block:"center"})}
  if(e.key==="ArrowUp"||e.key==="k"){e.preventDefault();setActive(Math.max(0,view.active-1));app.querySelector(".row.active")?.scrollIntoView({block:"center"})}
});
if(synth){synth.getVoices(); synth.onvoiceschanged=()=>{if(view.sheet&&view.sheet.type==="settings")renderSheet()}}

(async function init(){
  app.innerHTML=`<div class="wrap" style="padding-block:40px;color:var(--ink-soft)">正在打开书架…</div>`;
  await DB.open();
  USER=await DB.all();
  // migrate books saved by the first version (stored in localStorage)
  if(Array.isArray(S.books)&&S.books.length){
    for(const o of S.books){const bk={id:o.id,title:o.title,title2:o.title2||"",la:o.la,lb:o.lb,color:o.color||1,added:Date.now(),chapters:[{t:"",a:o.a,b:o.b||""}]};await DB.put(bk);USER.push(bk)}
  }
  if(S.progress){for(const k in S.progress) if(!S.pos[k]) S.pos[k]={ch:0,i:S.progress[k],t:Date.now()}; delete S.progress}
  S.books=[]; save();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  const jm=(location.hash||"").match(/^#join-([A-Za-z0-9-]{12,40})$/);
  if(jm){const c=SYNC.norm(jm[1]); try{history.replaceState(null,"",location.pathname)}catch(e){location.hash=""}
    if(SYNC.code()!==c){SYNC.setCode(c); toast("已加入同步，正在下载你的书和生词…")}}
  render();
  if(SYNC.code()) SYNC.run();
})();
})();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
