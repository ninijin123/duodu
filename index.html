<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>对读 Duodu</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="对读">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8FAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#19211E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: library of book "spines" → reader with sentence-aligned rows (two columns on iPad, stacked on phone), floating action bar for the active pair */
:root{
  --paper:#EEF1EE; --surface:#FCFDFC; --ink:#141817; --ink-soft:#56635F; --line:#D3DCD5; --tr:#262B2A;
  --jade:#2C7765; --jade-wash:#DCEAE3; --hl:#F4E6BC; --danger:#A6473B; --mark:rgba(255,206,40,.45);
  --f-read:"Iowan Old Style","Charter",Georgia,"Songti SC",serif;
  --f-zh:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --f-zhserif:"Songti SC","STSong","Noto Serif CJK SC",serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  --fs:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111715; --surface:#19211E; --ink:#ECF1EE; --ink-soft:#9AA9A4; --tr:#DCE3DF; --line:#2B3732;
  --jade:#6CC2AA; --jade-wash:#1E332D; --hl:#463C1D; --danger:#E08A7C; --mark:rgba(255,200,40,.32); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111715; --surface:#19211E; --ink:#ECF1EE; --ink-soft:#9AA9A4; --tr:#DCE3DF; --line:#2B3732;
  --jade:#6CC2AA; --jade-wash:#1E332D; --hl:#463C1D; --danger:#E08A7C; --mark:rgba(255,200,40,.32); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:10px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:var(--f-zh);font-weight:600;font-size:22px;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--ink-soft);letter-spacing:.12em;text-transform:uppercase}
.spacer{flex:1}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 10px;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink)}
.ibtn:hover{background:var(--jade-wash)}
.ibtn.on{background:var(--jade-wash);color:var(--jade)}
.btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:0 12px;height:38px;font-size:14px;color:var(--ink-soft)}
.seg button.on{background:var(--jade);color:var(--surface)}
.title-cell{min-width:0;display:flex;flex-direction:column}
.title-cell b{font-family:var(--f-read);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-cell span{font-size:12px;color:var(--ink-soft)}

/* library */
.lib{max-width:1100px;margin:0 auto;padding-block:28px 60px}
.lib h1{font-family:var(--f-read);font-weight:400;font-style:italic;font-size:clamp(26px,4vw,34px);margin:0 0 4px;text-wrap:balance}
.lib .sub{color:var(--ink-soft);margin:0 0 24px;font-size:15px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
.book{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:4px 12px 12px 4px;padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:250px}
.book .cover{flex:1;padding:18px 16px 14px 24px;display:flex;flex-direction:column;gap:8px;position:relative}
.book .cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c,var(--jade))}
.pair{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--c,var(--jade))}
.book h3{margin:0;font-family:var(--f-read);font-weight:600;font-size:19px;line-height:1.3;text-wrap:balance}
.book .zhname{font-family:var(--f-zh)}
.book .meta{margin-top:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--c,var(--jade))}
.book.add{border-style:dashed;align-items:center;justify-content:center;color:var(--jade);gap:10px;font-weight:500;background:transparent}
.book .del{position:absolute;top:8px;right:8px;opacity:.55}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--jade-wash);color:var(--jade);font-weight:500;width:max-content}
.hint{margin-top:32px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px;line-height:1.65;color:var(--ink-soft);max-width:68ch}
.hint b{color:var(--ink)}

/* reader */
.reader{max-width:1180px;margin:0 auto;padding-block:24px 160px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;padding:6px 10px;border-radius:10px;cursor:pointer;position:relative}
.row.pbreak{margin-top:22px}
.row:hover{background:color-mix(in srgb,var(--jade-wash) 45%,transparent)}
.row.active{background:var(--jade-wash)}
.row.speaking .s{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.s{font-size:var(--fs);line-height:1.7;min-width:0;overflow-wrap:anywhere}
.s.zh{font-family:var(--f-zh);letter-spacing:.02em}
.s:not(.zh){font-family:var(--f-read)}
.s.b{color:var(--ink-soft)}
.mode-inter .row{grid-template-columns:1fr;max-width:760px;margin-inline:auto;width:100%}
.mode-inter .s.b{font-size:calc(var(--fs)*.82);padding-bottom:4px}
.mode-hide .row{grid-template-columns:1fr;max-width:760px;margin-inline:auto;width:100%}
.mode-hide .s.b{display:none;font-size:calc(var(--fs)*.82)}
.mode-hide .row.active .s.b{display:block}
.colhead{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;padding:0 10px 14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.mode-inter .colhead,.mode-hide .colhead{display:none}
.num{position:absolute;left:-30px;top:12px;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;opacity:0}
.row.active .num{opacity:1}
@media (max-width:700px){
  .row,.colhead{grid-template-columns:1fr}
  .colhead{display:none}
  .row .s.b{font-size:calc(var(--fs)*.82)}
  .num{display:none}
  .hide-sm{display:none!important}
}

/* action bar */
.actions{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.14);max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
.actions .ibtn{font-size:14px;height:44px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.35);z-index:20;display:flex;justify-content:flex-end}
.sheet{width:min(440px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.wide{width:min(860px,100%)}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px 20px;border-bottom:1px solid var(--line)}
.sheet header h2{margin:0;font-size:18px;font-weight:600;flex:1}
.sheet .body{flex:1;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 30px 20px;display:flex;flex-direction:column;gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--ink-soft)}
input[type=text],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink)}
textarea{min-height:200px;resize:vertical;line-height:1.6;font-family:var(--f-read)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>*{min-width:0}
.row-f{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
input[type=range]{accent-color:var(--jade);width:160px}
.note{font-size:13px;color:var(--ink-soft);line-height:1.6}
.vocab{display:flex;flex-direction:column;gap:10px}
.vitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.vitem .w{font-family:var(--f-read);font-size:19px;font-weight:600}
.vitem .w.zh{font-family:var(--f-zh)}
.vitem .ctx{font-size:14px;color:var(--ink-soft);line-height:1.55}
.vitem .foot{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.vitem a{color:var(--jade);font-weight:500;text-decoration:none}
.empty{color:var(--ink-soft);font-size:14px;line-height:1.6;padding:20px 0}
.chap-btn{border:0;background:none;padding:0;text-align:left;color:inherit;min-width:0;display:flex;flex-direction:column}
.chap-btn span{color:var(--jade)!important;font-weight:500}
.ch-title{font-family:var(--f-read);font-weight:600;font-size:calc(var(--fs)*1.25);margin:0 0 18px 10px;text-wrap:balance}
.ch-title.zh{font-family:var(--f-zh)}
.ch-end{display:flex;justify-content:center;gap:12px;margin-top:48px;flex-wrap:wrap}
.toc{display:flex;flex-direction:column;gap:2px}
.toc button{display:flex;gap:12px;align-items:baseline;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-size:15px}
.toc button:hover{background:var(--jade-wash)}
.toc button.cur{background:var(--jade-wash);color:var(--jade);font-weight:600}
.toc .n{font-variant-numeric:tabular-nums;color:var(--ink-soft);min-width:2.2em;font-size:13px}
.toc .t{flex:1;min-width:0}
.toc .pct{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px}
.files{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.files{grid-template-columns:1fr}}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--paper)}
.drop .fn{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.drop .fn.muted{color:var(--ink-soft)}
.map{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.mrow:first-child{border-top:0}
.mrow.head{background:var(--paper);font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.06em}
.mrow .ta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .ta small{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.mrow select{padding:6px 8px;font-size:13px;min-width:0;width:100%}
.mrow.off .ta{opacity:.45}
@media (max-width:600px){.mrow{grid-template-columns:28px minmax(0,1fr)}.mrow select{grid-column:2}.mrow.head>:last-child{display:none}}
.busy{font-size:14px;color:var(--jade);font-weight:500}
.mtbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;margin:0 0 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px}
.mtbar.err{border-color:var(--danger);color:var(--danger)}
.sec{margin:10px 0 0;font-size:15px;font-weight:600;color:var(--ink)}
.w{cursor:pointer;border-radius:4px;transition:background .12s}
.w:hover{background:var(--jade-wash)}
.w.on{background:var(--hl)}
.pop{position:absolute;z-index:15;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-family:var(--f-ui)}
.pop .pw{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pop .pw b{font-family:var(--f-read);font-size:22px;font-weight:600}
.pop .ph{color:var(--ink-soft);font-size:14px}
.pop .pos{font-size:12px;font-weight:600;color:var(--jade);background:var(--jade-wash);padding:1px 7px;border-radius:99px}
.pop .pm{font-size:17px;line-height:1.5}
.pop .pb{font-size:13px;color:var(--ink-soft)}
.pop .pex{margin-top:4px;padding-top:8px;border-top:1px solid var(--line);font-family:var(--f-read);font-size:15px;line-height:1.5;display:flex;flex-direction:column;gap:2px}
.pop .pa{display:flex;gap:4px;margin-top:4px;align-items:center;flex-wrap:wrap}
.pop .pa .ibtn{height:36px;font-size:13px}
.pop .pa a{color:var(--jade);font-size:13px;font-weight:500;text-decoration:none;margin-left:auto}
.w.kw{text-decoration:underline;text-decoration-color:var(--jade);text-decoration-thickness:2px;text-underline-offset:4px}
.kwp{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:0 0 20px;overflow:hidden}
.kwp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:600;font-size:15px}
.kwp summary::-webkit-details-marker{display:none}
.kwp summary .note{font-weight:400}
.kwp .kwbody{padding:0 16px 14px;display:flex;flex-direction:column;gap:2px}
.kwi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.kwi .kt{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.kwi b{font-family:var(--f-read);font-size:17px}
.kwi .ph{font-size:13px;color:var(--ink-soft)}
.kwi .pos{font-size:11px;font-weight:600;color:var(--jade);background:var(--jade-wash);padding:1px 6px;border-radius:99px}
.kwi .km{font-size:15px}
.kwi .ibtn.done{color:var(--jade)}
.duebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 22px;padding:14px 16px;border-radius:14px;background:var(--jade-wash)}
.duebar span{font-size:15px}
.think{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:16px;max-width:860px;margin-inline:auto}
.think h3{margin:0;font-family:var(--f-read);font-size:calc(var(--fs)*1.15);font-weight:600}
.qcard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.qcard .qn{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--jade)}
.qcard .qe{font-family:var(--f-read);font-size:calc(var(--fs)*.95);line-height:1.55}
.qcard .qz{font-family:var(--f-zh);font-size:calc(var(--fs)*.78);color:var(--ink-soft);line-height:1.6}
.qcard textarea{min-height:96px;font-size:16px}
.qcard .qa{display:flex;gap:8px;flex-wrap:wrap}
.qcard .ref,.qcard .fb{border-radius:10px;padding:12px 14px;line-height:1.65;font-size:15px;white-space:pre-wrap}
.qcard .ref{background:var(--jade-wash)}
.qcard .ref .zh{font-family:var(--f-zh);color:var(--ink-soft);margin-top:8px}
.qcard .fb{background:var(--paper);border:1px dashed var(--jade)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;font-size:15px;line-height:1.45;color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--jade);background:var(--jade-wash);color:var(--ink)}
.opt.wrong{border-color:var(--danger);color:var(--danger)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 16px}
.flow .fl{font-size:13px;color:var(--ink-soft);margin-right:4px;font-variant-numeric:tabular-nums}
.flow button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--ink-soft)}
.flow button.done{background:var(--jade-wash);color:var(--jade);border-color:transparent}
.flow button.next{border-color:var(--jade);color:var(--ink);font-weight:600}
.prep{display:flex;flex-direction:column;gap:12px;margin:0 0 18px}
.row.marked{box-shadow:inset 3px 0 0 var(--jade)}
.row.marked .s.a{background:linear-gradient(transparent 62%,var(--hl) 62%)}
.mk{grid-column:1/-1;font-size:14px;color:var(--jade);font-family:var(--f-ui);padding:2px 0 4px;line-height:1.5}
.midcard{margin:18px 10px;padding:14px 16px;border:1px dashed var(--jade);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;font-size:15px}
.midcard textarea{min-height:64px;font-size:16px}
.picks{display:flex;flex-direction:column;gap:6px}
.picks button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;font-family:var(--f-read);font-size:14px;line-height:1.5;color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.6;font-size:15px;white-space:pre-wrap}
.msg.ai{background:var(--jade-wash);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--paper);border:1px solid var(--line);align-self:flex-end;border-bottom-right-radius:4px}
.nb h4{margin:18px 0 6px;font-family:var(--f-read);font-size:18px}
.nb .nbi{font-size:14px;line-height:1.65;margin:4px 0;white-space:pre-wrap}
.nb .nbl{font-size:12px;font-weight:600;color:var(--jade);letter-spacing:.06em;display:block;margin-top:8px}
.lv{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink-soft)}
.lv.use{border-color:var(--jade);color:var(--jade)}
.libacts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 22px}
/* --- layout polish --- */
.row{gap:0 48px;padding:8px 14px}
.row.pbreak{margin-top:26px}
.s{line-height:1.75}
.reader:not(.mode-inter):not(.mode-hide) .s.b{font-size:calc(var(--fs)*.92);line-height:1.8}
.row,.colhead,.midcard,.qcard,.kwp,.mtbar,details.pre,.think,.duebar,.vitem,.pop{box-sizing:border-box}
.s{color:var(--ink);text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.s.b{color:var(--tr)}
.tr-light .s.b{color:var(--ink-soft)}
.tr-light .row.active .s.b{color:var(--ink)}
.zh-serif .s.zh{font-family:var(--f-zhserif)}
.s.zh{letter-spacing:.01em}
.colhead{padding:0 14px 12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.ch-title{margin:4px 0 20px 14px}
.row.marked{box-shadow:none}
.row.marked .s.a{background:none}
.hlx{background:var(--mark);border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}

const ic=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cjk=l=>l==="zh"||l==="ja";

/* =========================================================
   Text splitting
   ========================================================= */
function splitSentences(t){
  const re=/[^.!?。！？…\n]+(?:[.!?。！？…]+["'»”’)）」』]*|$)/g;
  return (t.match(re)||[]).map(s=>s.trim()).filter(s=>s&&!/^["'»”’)）」』]+$/.test(s));
}
function paras(t){return (t||"").replace(/\r/g,"").split(/\n+/).map(p=>p.trim()).filter(Boolean)}
const vlen=s=>s.replace(/\s+/g,"").length;

/* chapter headings: Chapter 1 / Part One / Глава 1 / Часть первая / 第一章 / 第一部 / roman numerals / Appendix */
const HEAD=/^(?:(?:chapter|part|book)\s+[\w-]+|appendix.*|(?:глава|часть)\s+\S+|приложение.*|第[一二三四五六七八九十百零〇两\d]+[章部节回卷篇]|附录.*|[IVXLC]{1,7}\.?|\d{1,3}\.?)$/i;
function isHead(line){const l=line.trim();return l.length>0&&l.length<=40&&HEAD.test(l)}
function splitChapters(text){
  const lines=paras(text); const chunks=[]; let cur={t:"",lines:[]};
  for(const ln of lines){
    if(isHead(ln)){chunks.push(cur);cur={t:ln,lines:[]}} else cur.lines.push(ln);
  }
  chunks.push(cur);
  // merge headings with tiny bodies (e.g. "PART ONE" right before "Chapter 1") into the next title
  const out=[]; let carry="", carryBody="";
  for(const c of chunks){
    const body=c.lines.join("\n");
    if(vlen(body)<40){ if(c.t) carry=[carry,c.t].filter(Boolean).join(" · "); if(body) carryBody=[carryBody,body].filter(Boolean).join("\n"); continue}
    out.push({t:[carry,c.t].filter(Boolean).join(" · ")||"开头",text:[carryBody,body].filter(Boolean).join("\n")}); carry=""; carryBody="";
  }
  if(carryBody&&out.length) out[out.length-1].text+="\n"+carryBody;
  return out;
}

/* =========================================================
   Length-based alignment (Gale–Church style dynamic programming)
   ========================================================= */
function phi(z){const t=1/(1+.2316419*z),d=.3989423*Math.exp(-z*z/2);return 1-d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))))}
function matchCost(la,lb,c){
  const m=(la*c+lb)/2; if(m<=0) return 0;
  const d=Math.abs(lb-la*c)/Math.sqrt(m*6.8);
  return -Math.log(Math.max(1e-12,2*(1-phi(d))));
}
const MOVES_TEXT=[[1,1,0],[1,0,4.5],[0,1,4.5],[2,1,2.3],[1,2,2.3],[2,2,5],[3,1,5.5],[1,3,5.5]];
const MOVES_CH=[[1,1,0],[1,0,3],[0,1,3]];
function dpAlign(A,B,moves){
  const n=A.length,m=B.length;
  const sa=A.reduce((x,y)=>x+y,0), sb=B.reduce((x,y)=>x+y,0);
  const c=sa?sb/sa:1;
  const pa=[0],pb=[0]; A.forEach(v=>pa.push(pa[pa.length-1]+v)); B.forEach(v=>pb.push(pb[pb.length-1]+v));
  const W=m+1, cost=new Float64Array((n+1)*W).fill(Infinity), back=new Int8Array((n+1)*W).fill(-1);
  cost[0]=0;
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){
    const here=cost[i*W+j]; if(here===Infinity) continue;
    for(let k=0;k<moves.length;k++){
      const [di,dj,pen]=moves[k], ni=i+di, nj=j+dj; if(ni>n||nj>m) continue;
      const v=here+pen+matchCost(pa[ni]-pa[i],pb[nj]-pb[j],c);
      if(v<cost[ni*W+nj]){cost[ni*W+nj]=v;back[ni*W+nj]=k}
    }
  }
  const out=[]; let i=n,j=m;
  while(i>0||j>0){const k=back[i*W+j]; if(k<0)break; const [di,dj]=moves[k]; out.push([i-di,i,j-dj,j]); i-=di; j-=dj}
  return out.reverse();
}
function alignChapter(a,b,la,lb){
  const A=paras(a), B=paras(b||""); const out=[];
  const ja=cjk(la)?"":" ", jb=cjk(lb)?"":" ";
  if(!B.length){A.forEach(p=>splitSentences(p).forEach((s,j)=>out.push({a:s,b:"",p:j===0})));return out}
  // paragraphs first, then sentences inside each paragraph group
  const groups=(A.length*B.length>400000)?[[0,A.length,0,B.length]]:dpAlign(A.map(vlen),B.map(vlen),MOVES_TEXT);
  for(const [i0,i1,j0,j1] of groups){
    const SA=splitSentences(A.slice(i0,i1).join("\n")), SB=splitSentences(B.slice(j0,j1).join("\n"));
    if(!SA.length&&!SB.length) continue;
    let first=true;
    if(SA.length*SB.length>250000){out.push({a:SA.join(ja),b:SB.join(jb),p:true});continue}
    for(const [x0,x1,y0,y1] of dpAlign(SA.map(vlen),SB.map(vlen),MOVES_TEXT)){
      out.push({a:SA.slice(x0,x1).join(ja),b:SB.slice(y0,y1).join(jb),p:first}); first=false;
    }
  }
  return out;
}

/* =========================================================
   File reading: TXT (UTF-8 / GB18030 / CP1251) and EPUB
   ========================================================= */
function decodeText(buf,lang){
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^﻿/,"")}catch(e){}
  const enc=lang==="ru"?"windows-1251":(lang==="zh"?"gb18030":(lang==="ja"?"shift_jis":"windows-1252"));
  try{return new TextDecoder(enc).decode(buf)}catch(e){return new TextDecoder("utf-8").decode(buf)}
}
function resolvePath(base,href){
  const parts=(base?base.split("/"):[]).concat(decodeURIComponent(href.split("#")[0]).split("/")); const st=[];
  for(const p of parts){if(p===""||p===".")continue;if(p==="..")st.pop();else st.push(p)}
  return st.join("/");
}

/* minimal ZIP reader for EPUB (stored + deflate), no external library */
async function unzip(buf){
  const dv=new DataView(buf), td=new TextDecoder();
  let e=buf.byteLength-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error("不是有效的 EPUB 文件");
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), local=dv.getUint32(p+42,true);
    const name=td.decode(new Uint8Array(buf,p+46,nl)); files[name]={method,csize,local}; p+=46+nl+xl+cl;
  }
  const lower={}; for(const k in files) lower[k.toLowerCase()]=k;
  return {file(name){
    const f=files[name]||files[lower[String(name).toLowerCase()]]; if(!f) return null;
    return {async async(){
      const lp=f.local, ln=dv.getUint16(lp+26,true), le=dv.getUint16(lp+28,true);
      const data=new Uint8Array(buf,lp+30+ln+le,f.csize); let out=data;
      if(f.method===8){
        if(typeof DecompressionStream==="undefined") throw new Error("系统版本太旧，请升级到 iPadOS 16.4 以上");
        out=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
      } else if(f.method!==0) throw new Error("不支持的压缩格式");
      return td.decode(out);
    }};
  }};
}
async function readEpub(buf){
  const zip=await unzip(buf);
  const cf=zip.file("META-INF/container.xml"); if(!cf) throw new Error("EPUB 里缺少 container.xml"); const cont=await cf.async("string");
  const xml=s=>new DOMParser().parseFromString(s,"application/xml");
  const opfPath=xml(cont).querySelector("rootfile").getAttribute("full-path");
  const base=opfPath.includes("/")?opfPath.slice(0,opfPath.lastIndexOf("/")):"";
  const of=zip.file(opfPath); if(!of) throw new Error("找不到书的目录文件"); const opf=xml(await of.async("string"));
  const man={}; opf.querySelectorAll("manifest > item, item").forEach(it=>man[it.getAttribute("id")]=it.getAttribute("href"));
  const bookTitle=(opf.getElementsByTagNameNS("*","title")[0]||{}).textContent||"";
  const docs=[];
  for(const ref of opf.querySelectorAll("spine > itemref, itemref")){
    const href=man[ref.getAttribute("idref")]; if(!href) continue;
    const f=zip.file(resolvePath(base,href)); if(!f) continue;
    const html=await f.async("string");
    let doc=new DOMParser().parseFromString(html,"application/xhtml+xml");
    if(doc.querySelector("parsererror")) doc=new DOMParser().parseFromString(html,"text/html");
    const body=doc.body||doc.documentElement; const lines=[]; let head="";
    body.querySelectorAll("h1,h2,h3,h4,h5,h6,p,li,blockquote>div,pre").forEach(el=>{
      if(el.closest("p,li")&&el.closest("p,li")!==el) return;
      const t=el.textContent.replace(/\s+/g," ").trim(); if(!t) return;
      if(/^H\d$/i.test(el.tagName)&&!head) head=t;
      lines.push(t);
    });
    if(!lines.length){const t=(body.textContent||"").trim(); if(t) lines.push(...paras(t))}
    if(lines.length) docs.push({head,lines});
  }
  // prefer heading-based chapters across the whole book; fall back to one chapter per spine file
  const all=docs.map(d=>d.lines.join("\n")).join("\n");
  let ch=splitChapters(all);
  if(ch.length<3){
    ch=docs.map(d=>({t:d.head||d.lines[0].slice(0,30),text:d.lines.filter((l,i)=>!(i===0&&l===d.head)).join("\n")}))
           .filter(c=>vlen(c.text)>0);
  }
  return {title:bookTitle.trim(),chapters:ch};
}
async function readAnyFile(file,lang){
  const buf=await file.arrayBuffer();
  if(/\.epub$/i.test(file.name)) return readEpub(buf);
  const text=decodeText(buf,lang);
  return {title:file.name.replace(/\.(txt|text)$/i,""),chapters:splitChapters(text)};
}

const DB={db:null,
  open(){return new Promise((res)=>{try{const r=indexedDB.open("duodu",1);r.onupgradeneeded=()=>r.result.createObjectStore("books",{keyPath:"id"});r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
  tx(mode){return this.db.transaction("books",mode).objectStore("books")},
  all(){return new Promise(res=>{if(!this.db)return res([]);const q=this.tx("readonly").getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})},
  put(b,keep){if(!keep&&b&&!b.sample)b.updated=Date.now(); if(!keep&&typeof SYNC!=="undefined")SYNC.dirty(); return new Promise(res=>{if(!this.db)return res(false);const q=this.tx("readwrite").put(b);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})},
  del(id,keep){if(!keep){S.bookDel=(S.bookDel||[]).concat({id,t:Date.now()});save()} return new Promise(res=>{if(!this.db)return res(false);const q=this.tx("readwrite").delete(id);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}
};

const allBooks=()=>[...USER.sort((x,y)=>(y.added||0)-(x.added||0)),...SAMPLES];
const cache={};
function pairsOf(bk,ch){const k=bk.id+":"+ch;if(!cache[k]){const c=bk.chapters[ch];
  if(c.b) cache[k]=alignChapter(c.a,c.b,bk.la,bk.lb);
  else{const base=alignChapter(c.a,"",bk.la,null);cache[k]=c.mt?base.map((p,i)=>({...p,b:c.mt[i]||""})):base}}
  return cache[k]}

/* ---------- machine translation (DeepSeek via the site's /api/translate) ---------- */
const MT={running:{}};
const mtTarget=bk=>bk.lb||S.settings.mtTo||"zh";
function needsMT(bk,ch){if(bk.sample)return false;const c=bk.chapters[ch];if(c.b)return false;const n=pairsOf(bk,ch).length;return !c.mt||c.mt.filter(Boolean).length<n}
function mtPrompt(sentences,context,from,to,glossary){
  const system=[`You are an expert literary translator. Translate from ${from} into ${to}.`,
    "Translate every numbered line faithfully and naturally, the way a published literary translation reads.",
    'Output only lines in the form "N|translation", one line per input line, in the same order, keeping each number.',
    "Do not merge or split lines. Do not add notes or explanations.",
    glossary.trim()?"Use this glossary consistently:\n"+glossary.trim().slice(0,3000):""].filter(Boolean).join("\n");
  const user=(context?`Preceding text (for context only, do not translate):\n${context}\n\n`:"")+sentences.map((x,i)=>`${i+1}|${String(x).replace(/\s*\n\s*/g," ")}`).join("\n");
  return [{role:"system",content:system},{role:"user",content:user}];
}
async function callDirect(sentences,context,from,to){
  const st=S.settings, base=(st.mtBase||"").trim().replace(/\/+$/,"");
  if(!base) throw new Error("请在“阅读设置”里填接口地址");
  const url=/\/chat\/completions$/.test(base)?base:base+"/chat/completions";
  let r;
  try{r=await fetch(url,{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+st.mtKey.trim()},
    body:JSON.stringify({model:(st.mtModel||"deepseek-chat").trim(),messages:mtPrompt(sentences,context,LANGS[from].name,LANGS[to].name,st.glossary||""),temperature:1.3,max_tokens:6000,stream:false})})}
  catch(e){throw new Error("连不上翻译接口：检查网络和接口地址（也可能是这个接口不允许网页直接调用）")}
  if(!r.ok){const t=await r.text().catch(()=>"");
    throw new Error(r.status===401?"密钥无效，请检查 API Key":r.status===404?"接口地址或模型名称不对":r.status===402?"余额不足，请充值":r.status===429?"请求太频繁，稍后再试":`接口返回错误 ${r.status}：${t.slice(0,120)}`)}
  const d=await r.json(); const text=(d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
  const out=new Array(sentences.length).fill("");
  text.split("\n").forEach(line=>{const m=line.match(/^\s*(\d+)\s*[|｜]\s*(.*)$/);if(m){const n=+m[1]-1;if(n>=0&&n<out.length)out[n]=m[2].trim()}});
  return out;
}
async function callMT(sentences,context,from,to){
  {const text=await llm(mtPrompt(sentences,context,LANGS[from].name,LANGS[to].name,S.settings.glossary||""),6000,1.3);
   const out=new Array(sentences.length).fill("");
   text.split("\n").forEach(line=>{const m=line.match(/^\s*(\d+)\s*[|｜]\s*(.*)$/);if(m){const n=+m[1]-1;if(n>=0&&n<out.length)out[n]=m[2].trim()}});
   return out}
  let r;
  try{r=await fetch("/api/translate",{method:"POST",headers:{"content-type":"application/json","x-passcode":S.settings.mtPass||""},
    body:JSON.stringify({sentences,context,from:LANGS[from].name,to:LANGS[to].name,glossary:S.settings.glossary||""})})}
  catch(e){throw new Error("连不上网络，联网后再试")}
  let d=null; try{d=await r.json()}catch(e){}
  if(!d) throw new Error(r.status===404?"还没有填 API Key：打开“阅读设置”填写接口地址和 API Key":"翻译服务出错（"+r.status+"）");
  if(!r.ok||d.error) throw new Error(d.error||("翻译服务出错（"+r.status+"）"));
  return d.translations||[];
}
function paintMT(bk,ch,idxs){
  if(view.name!=="reader"||view.book!==bk||view.ch!==ch) return;
  const c=bk.chapters[ch];
  idxs.forEach(i=>{const cell=app.querySelector(`.row[data-i="${i}"] .s.b`); if(cell){cell.textContent=c.mt[i]||""}});
  const st=MT.running[bk.id+":"+ch], bar=document.getElementById("mtbar");
  if(st&&bar) bar.querySelector("span").textContent=`正在翻译 ${st.done} / ${st.total} 句…`;
}
async function translateChapter(bk,ch){
  const key=bk.id+":"+ch; if(MT.running[key]&&!MT.running[key].err) return;
  const c=bk.chapters[ch], to=mtTarget(bk);
  if(to===bk.la){toast("译文语言和原文一样，请在“阅读设置”里换一种");return}
  if(!bk.lb) bk.lb=to;
  const src=alignChapter(c.a,"",bk.la,null).map(p=>p.a);
  if(!c.mt||c.mt.length!==src.length) c.mt=src.map((_,i)=>(c.mt&&c.mt[i])||"");
  const todo=[]; src.forEach((_,i)=>{if(!c.mt[i]) todo.push(i)});
  MT.running[key]={done:src.length-todo.length,total:src.length,err:""}; delete cache[key];
  if(view.name==="reader"&&view.book===bk) keepScroll(render);
  const batches=[]; for(let i=0;i<todo.length;i+=25) batches.push(todo.slice(i,i+25));
  let q=0;
  const worker=async()=>{while(q<batches.length&&!MT.running[key].err){
    const b=batches[q++];
    const res=await callMT(b.map(i=>src[i]),src.slice(Math.max(0,b[0]-3),b[0]).join(" "),bk.la,to);
    b.forEach((idx,j)=>{if(res[j]) c.mt[idx]=res[j]});
    MT.running[key].done=c.mt.filter(Boolean).length; delete cache[key];
    await DB.put(bk); paintMT(bk,ch,b);
  }};
  try{await Promise.all([worker(),worker(),worker()]); delete MT.running[key]}
  catch(e){MT.running[key].err=e.message||String(e)}
  delete cache[key];
  if(view.name==="reader"&&view.book===bk&&view.ch===ch) keepScroll(render);
}

function openBook(id,ch){

  if(ch!=null){S.pos[id]={ch:c,i:view.active,t:Date.now()};save()}
  render();
  if(view.active>=0){const r=app.querySelector(`.row[data-i="${view.active}"]`); r&&r.scrollIntoView({block:"center"})} else window.scrollTo(0,0);
  if(S.settings.mtAuto&&needsMT(bk,c)&&!MT.running[bk.id+":"+c]) translateChapter(bk,c);
  if(llmReady()&&!bk.sample&&!cjk(bk.la)&&!bk.chapters[c].keys&&!KW.running[bk.id+":"+c]) genKeys(bk,c);
  if(llmReady()&&!bk.sample&&!bk.chapters[c].prep&&!FLOW.running[bk.id+":"+c+":prep"]) FLOW.genPrep(bk,c);
}

/* ---------- speech ---------- */
const synth=window.speechSynthesis;
const NOVELTY=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/i;
function voiceScore(v,tag){let sc=0;const n=v.name;
  if(/premium|高品质|优质/i.test(n))sc+=40; if(/enhanced|增强/i.test(n))sc+=25; if(/siri/i.test(n))sc+=20; if(/natural|neural/i.test(n))sc+=20;
  if(NOVELTY.test(n))sc-=100; if(v.lang.replace("_","-")===tag)sc+=5; if(v.localService)sc+=1; return sc}
function voicesFor(code){if(!synth)return[];const tag=LANGS[code].tts;
  return synth.getVoices().filter(v=>v.lang.slice(0,2).toLowerCase()===tag.slice(0,2)).sort((a,b)=>voiceScore(b,tag)-voiceScore(a,tag))}
function voiceFor(tag){if(!synth)return null;
  const code=Object.keys(LANGS).find(k=>LANGS[k].tts===tag)||"en";
  const pick=(S.settings.voices||{})[code]; const list=voicesFor(code);
  return (pick&&list.find(v=>v.voiceURI===pick))||list[0]||null}
function utter(text,lang){
  return new Promise(res=>{
    if(!synth||!text||!lang){res();return}
    const u=new SpeechSynthesisUtterance(text); const tag=LANGS[lang].tts;
    u.lang=tag; const v=voiceFor(tag); if(v)u.voice=v; u.rate=S.settings.rate;
    u.onend=u.onerror=()=>res(); synth.speak(u);
  });
}
function sideLang(side){const b=view.book,sw=S.settings.swap;return side==="A"?(sw?(b.lb||b.la):b.la):(sw?b.la:b.lb)}
function sideText(i,side){const p=pairsOf(view.book,view.ch)[i],sw=S.settings.swap;return side==="A"?(sw?p.b:p.a):(sw?p.a:p.b)}
function sayOne(i,side){if(!synth){toast("这个浏览器不支持朗读");return}utter(sideText(i,side),sideLang(side))}
function markSpeak(i){
  app.querySelectorAll(".row.speaking").forEach(r=>r.classList.remove("speaking"));
  speakIdx=i; const r=app.querySelector(`.row[data-i="${i}"]`);
  if(r){r.classList.add("speaking"); r.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
}
async function speakFrom(start){
  if(!synth){toast("这个浏览器不支持朗读");return}
  stopSpeak(); speaking=true; const token=Symbol(); speakFrom.t=token;
  const pb=document.getElementById("playAll"); if(pb){pb.classList.add("on");pb.innerHTML=ic("stop")}
  const n=pairsOf(view.book,view.ch).length;
  for(let i=start;i<n;i++){
    if(speakFrom.t!==token) return;
    markSpeak(i); view.active=i; S.pos[view.book.id]={ch:view.ch,i,t:Date.now()}; save();
    app.querySelectorAll(".row.active").forEach(r=>r.classList.remove("active"));
    const r=app.querySelector(`.row[data-i="${i}"]`); r&&r.classList.add("active");
    await utter(sideText(i,"A"),sideLang("A"));
    if(S.settings.autoB && speakFrom.t===token) await utter(sideText(i,"B"),sideLang("B"));
  }
  if(speakFrom.t===token) stopSpeak();
}
function stopSpeak(){
  speakFrom.t=null; speaking=false; if(synth) synth.cancel();
  app.querySelectorAll(".row.speaking").forEach(r=>r.classList.remove("speaking")); speakIdx=-1;
  const pb=document.getElementById("playAll"); if(pb){pb.classList.remove("on");pb.innerHTML=ic("play")}
}

/* ---------- spaced repetition ---------- */
const DAY=864e5, INTERVALS=[1,3,7,15,30,60];
function today0(){const d=new Date();d.setHours(0,0,0,0);return +d}
function isMastered(v){return (v.stage||0)>=INTERVALS.length}
function dueList(){const end=today0()+DAY;return S.vocab.filter(v=>v.seen&&!isMastered(v)&&(v.due||0)<end)}
function nextLabel(v){if(isMastered(v))return "已掌握";if(!v.seen)return "待学习";const d=Math.round(((v.due||0)-today0())/DAY);return d<=0?"今天复习":d===1?"明天复习":`${d} 天后复习`}
function addVocab(item){
  const k=(item.text||"").toLowerCase();
  if(S.vocab.some(v=>v.lang===item.lang&&(v.text||"").toLowerCase()===k)) return false;
  S.vocab.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),kind:"word",t:Date.now(),u:Date.now(),stage:0,due:0,...item});
  return true;
}
S.vocab.forEach(v=>{if(v.seen==null) v.seen=(v.stage||0)>0||v.kind==="idea"||!!v.ok});
// migrate items saved before spaced repetition existed
S.vocab.forEach(v=>{if(v.stage==null){v.stage=v.ok?2:0;v.due=v.ok?today0()+7*DAY:0;delete v.ok}});

/* ---------- generic call to the translation model ---------- */
function llmReady(){return true}
const hasLocalKey=()=>!!(S.settings.mtKey&&S.settings.mtKey.trim());
async function llm(messages,max_tokens,temperature){
  if(!hasLocalKey()){
    let r;
    try{r=await fetch("/api/llm",{method:"POST",headers:{"content-type":"application/json","x-sync-code":(typeof SYNC!=="undefined"&&SYNC.code())||"none"},body:JSON.stringify({messages,max_tokens,temperature})})}
    catch(e){throw new Error("连不上网络，联网后再试")}
    let d=null; try{d=await r.json()}catch(e){}
    if(r.status===404&&!d) throw new Error("网站的 AI 服务还没部署好");
    if(!r.ok||!d||d.error) throw new Error((d&&d.error)||("AI 服务出错（"+r.status+"）"));
    return d.content||"";
  }
  const st=S.settings, base=(st.mtBase||"").trim().replace(/\/+$/,""), url=/\/chat\/completions$/.test(base)?base:base+"/chat/completions";
  let r;
  try{r=await fetch(url,{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+st.mtKey.trim()},
    body:JSON.stringify({model:(st.mtModel||"deepseek-chat").trim(),messages,temperature,max_tokens,stream:false})})}
  catch(e){throw new Error("连不上翻译接口，检查网络")}
  if(!r.ok) throw new Error(r.status===401?"API Key 无效":r.status===402?"余额不足，请充值":r.status===429?"请求太频繁，稍后再试":"接口出错（"+r.status+"）");
  const d=await r.json(); return (d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
}

/* ---------- chapter key words ---------- */
const KW={running:{}};
async function genKeys(bk,ch){
  const key=bk.id+":"+ch; if(KW.running[key]&&!KW.running[key].err) return;
  const c=bk.chapters[ch], to=(S.settings.mtTo&&S.settings.mtTo!==bk.la)?S.settings.mtTo:"zh", toName=LANGS[to].name;
  KW.running[key]={err:""}; if(view.name==="reader"&&view.book===bk&&view.ch===ch) keepScroll(render);
  const sys=`You help a C1-level ${LANGS[bk.la].name} learner read a novel. From the chapter, choose the 20 words most worth learning: words uncommon for a C1 learner that recur in the chapter, are needed to understand it, or are key terms of the book. Exclude proper names and everyday words. Order them by importance.
Output exactly one line per word and nothing else, in this form:
word as it appears in the text|dictionary form|IPA|part of speech in ${toName}|meaning in this chapter in ${toName}, under 15 characters|exactly one of 日常常用 / 书面正式 / 文学少见|2–3 common collocations separated by ";"|one short sentence from the chapter containing the word, copied exactly`;
  try{
    const text=await llm([{role:"system",content:sys},{role:"user",content:c.a.slice(0,30000)}],2500,.7);
    const keys=[];
    text.split("\n").forEach(l=>{const p=l.split(/[|｜]/).map(x=>x.trim());if(p.length>=5&&p[0]&&p[0].length<40)keys.push({form:p[0],base:p[1]||p[0],ipa:p[2]||"",pos:p[3]||"",mean:p[4]||"",level:p[5]||"",col:p[6]||"",ctx:p.slice(7).join(" ")||""})});
    if(!keys.length) throw new Error("没有拿到结果，请重试");
    c.keys=keys; await DB.put(bk); delete KW.running[key];
  }catch(e){KW.running[key].err=e.message||String(e)}
  if(view.name==="reader"&&view.book===bk&&view.ch===ch) keepScroll(render);
}
function keyToVocab(bk,ch,k){
  const pairs=pairsOf(bk,ch), low=(k.ctx||"").toLowerCase().slice(0,40);
  const p=low?pairs.find(x=>(x.a||"").toLowerCase().includes(low)):null;
  return {text:k.base||k.form,lang:bk.la,mean:[k.ipa,k.pos,k.mean].filter(Boolean).join(" "),level:k.level||"",col:k.col||"",ctx:p?p.a:k.ctx,tr:p?p.b:"",
    book:bk.chapters.length>1?`${bk.title} · ${chName(bk,ch)}`:bk.title};
}

/* ---------- after-chapter thinking questions ---------- */
const QS={running:{},reveal:{},fb:{}};
let qsSaveT=null;
async function genQs(bk,ch){
  const key=bk.id+":"+ch; if(QS.running[key]&&!QS.running[key].err) return;
  const c=bk.chapters[ch], to=(S.settings.mtTo&&S.settings.mtTo!==bk.la)?S.settings.mtTo:"zh", toName=LANGS[to].name, fromName=LANGS[bk.la].name;
  QS.running[key]={err:""}; keepScroll(render);
  const sys=`You are a thoughtful literature teacher. Based on this chapter of a book, write 4 discussion questions that make the reader think: themes, characters' motives and feelings, symbolism, the author's techniques. The 4th question must ask the reader to connect the chapter to today's world or their own life and experience. Avoid simple recall questions. For each question give a reference answer of 3–5 sentences that points to evidence in the chapter.
Output for each question exactly four lines, then a blank line, nothing else:
Q|the question in ${fromName}
QZ|the question in ${toName}
A|the reference answer in ${fromName}
AZ|the reference answer in ${toName}`;
  try{
    const text=await llm([{role:"system",content:sys},{role:"user",content:c.a.slice(0,30000)}],3000,.8);
    const qs=[]; let cur=null;
    text.split("\n").forEach(l=>{const m=l.match(/^\s*(QZ|Q|AZ|A)\s*[|｜:：]\s*(.*)$/);if(!m)return;
      if(m[1]==="Q"){cur={q:m[2].trim(),qz:"",a:"",az:""};qs.push(cur)} else if(cur) cur[m[1].toLowerCase()]=m[2].trim()});
    if(!qs.length) throw new Error("没有拿到问题，请重试");
    c.qs=qs; c.ans=c.ans||{}; await DB.put(bk); delete QS.running[key];
  }catch(e){QS.running[key].err=e.message||String(e)}
  if(view.name==="reader"&&view.book===bk&&view.ch===ch) keepScroll(render);
}
async function feedbackQ(bk,ch,i){
  const c=bk.chapters[ch], q=c.qs[i], mine=((c.ans||{})[i]||"").trim(), key=bk.id+":"+ch+":"+i;
  if(!mine){toast("先写下你的回答");return}
  const to=(S.settings.mtTo&&S.settings.mtTo!==bk.la)?S.settings.mtTo:"zh", toName=LANGS[to].name;
  QS.fb[key]="AI 正在看你的回答…"; keepScroll(render);
  const sys=`You are a warm, honest literature teacher and ${LANGS[bk.la].name} writing coach. A C1-level learner answered a discussion question about a chapter. Reply in ${toName}, under 180 words, plain text without markdown:
观点：2–3 sentences on the ideas — what is insightful, and one point from the chapter they could add.
${LANGS[bk.la].name === "English" || true ? `语言：if the answer is written in ${LANGS[bk.la].name}, up to 3 corrections or more natural phrasings, each as "原句 → 修改（简短说明）". If it has no mistakes, say so. If the answer is not in ${LANGS[bk.la].name}, skip this part.` : ""}`;
  try{
    const out=await llm([{role:"system",content:sys},{role:"user",content:`Question: ${q.q}\nReference answer: ${q.a}\nStudent answer: ${mine}`}],700,.7);
    c.fb=c.fb||{}; c.fb[i]=out.trim(); delete QS.fb[key]; await DB.put(bk);
  }catch(e){QS.fb[key]="点评失败："+(e.message||e)}
  if(view.name==="reader"&&view.book===bk&&view.ch===ch) keepScroll(render);
}

/* =========================================================
   Reading flow: before / during / after a chapter, idea cards,
   active word use, diary, notebook, teach-a-friend
   ========================================================= */
const FLOW={running:{}, saveT:null,
  dayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`},
  to(bk){return (S.settings.mtTo&&S.settings.mtTo!==bk.la)?S.settings.mtTo:(bk.la==="zh"?"en":"zh")},
  saveSoon(bk){clearTimeout(this.saveT);this.saveT=setTimeout(()=>DB.put(bk),700)},
  here(bk,ch){return view.name==="reader"&&view.book===bk&&view.ch===ch},
  lines(text){return text.split("\n").map(l=>l.match(/^\s*(MCZ|MC|QZ|Q|AZ|ANS|A|O|EXP|FOCUSZ|FOCUS|R|EN|ZH|MISS)\s*[|｜:：]\s*(.*)$/)).filter(Boolean).map(m=>[m[1],m[2].trim()])},
  letter(x){const i="ABCD".indexOf(String(x).trim().charAt(0).toUpperCase());return i<0?0:i},
  mcLevel(){const l=S.settings.qLevel||"easy";
    return l==="easy"?"Make them EASY: ask about clear, important facts of the chapter (what happens, who does what, where, why in simple terms). Use simple, everyday words in the question and options. Wrong options should be clearly wrong to anyone who read the chapter."
      :l==="hard"?"Make them CHALLENGING: test inference, subtext, tone, irony and the meaning of key sentences. Wrong options should be plausible and close to the truth."
      :"Make them MEDIUM: mix understanding of key events with simple inference (why something happens, what a detail shows). Wrong options plausible but clearly distinguishable."},

  /* ---------- before reading ---------- */
  async genPrep(bk,ch){
    const key=bk.id+":"+ch+":prep"; if(this.running[key]&&!this.running[key].err) return;
    const c=bk.chapters[ch], prev=ch>0?bk.chapters[ch-1]:null, from=LANGS[bk.la].name, to=LANGS[this.to(bk)].name;
    this.running[key]={err:""}; if(this.here(bk,ch)) keepScroll(render);
    const sys=`You prepare a reader for the next chapter of a book. Output only these lines:
FOCUS|one question in ${from} to keep in mind while reading THIS chapter (about meaning, a character, or a theme; do not give away what happens)
FOCUSZ|the same question in ${to}${prev?`
Then 3 multiple-choice questions in ${to} about important events or ideas of the PREVIOUS chapter. ${this.mcLevel()} Each as:
R|question
O|option (exactly 4 lines)
ANS|correct letter A-D
EXP|one short sentence explaining the answer`:""}`;
    try{
      const text=await llm([{role:"system",content:sys},{role:"user",content:(prev?"PREVIOUS CHAPTER:\n"+prev.a.slice(0,12000)+"\n\n":"")+"THIS CHAPTER:\n"+c.a.slice(0,15000)}],1500,.7);
      const p={focus:"",focusZ:"",recall:[]}; let cur=null;
      this.lines(text).forEach(([k,v])=>{
        if(k==="FOCUS")p.focus=v; else if(k==="FOCUSZ")p.focusZ=v;
        else if(k==="R"){cur={q:v,opts:[],ans:0,exp:""};p.recall.push(cur)}
        else if(cur&&k==="O")cur.opts.push(v); else if(cur&&k==="ANS")cur.ans=this.letter(v); else if(cur&&k==="EXP")cur.exp=v;});
      if(!p.focus) throw new Error("没有拿到结果，请重试");
      p.recall=p.recall.filter(r=>r.opts.length>=2);
      c.prep=p; c.recallSel={}; await DB.put(bk); delete this.running[key];
    }catch(e){this.running[key].err=e.message||String(e)}
    if(this.here(bk,ch)) keepScroll(render);
  },
  mcHTML(prefix,items,sel){
    return items.map((it,i)=>{const s=(sel||{})[i];
      return `<div class="qcard"><span class="qn">选择题 ${i+1}</span><div class="qe">${esc(it.q)}</div>${it.qz?`<div class="qz">${esc(it.qz)}</div>`:""}
      <div class="opts">${it.opts.map((o,oi)=>`<button class="opt ${s!=null?(oi===it.ans?"right":oi===s?"wrong":""):""}" data-mc="${prefix}:${i}:${oi}" ${s!=null?"disabled":""}>${"ABCD"[oi]}. ${esc(o.replace(/^[A-D][.、)]\s*/,""))}</button>`).join("")}</div>
      ${s!=null?`<div class="ref">${s===it.ans?"答对了。":`正确答案是 ${"ABCD"[it.ans]}。`}${it.exp?" "+esc(it.exp):""}</div>`:""}</div>`}).join("");
  },
  prepHTML(b,ch){
    if(b.sample) return "";
    const c=b.chapters[ch], st=this.running[b.id+":"+ch+":prep"];
    if(st&&st.err) return `<div class="mtbar err"><span>读前准备没生成：${esc(st.err)}</span><button class="btn" id="prepGo">重试</button></div>`;
    if(st) return `<div class="mtbar"><span>正在准备读前问题…</span></div>`;
    if(!c.prep) return llmReady()?`<div class="mtbar"><span>还没有读前准备。</span><button class="btn" id="prepGo">生成读前准备</button></div>`:"";
    const p=c.prep;
    return `<div class="prep">
      ${p.recall.length?`<div id="st-recall" class="prep"><div class="note"><b>读前 · 回顾上一章</b>：不要翻回去看，凭记忆选。</div>${this.mcHTML("r",p.recall,c.recallSel)}</div>`:""}
      <div class="qcard" id="st-focus"><span class="qn">带着这个问题读</span><div class="qe">${esc(p.focus)}</div>${p.focusZ?`<div class="qz">${esc(p.focusZ)}</div>`:""}</div>
    </div>`;
  },

  /* ---------- progress chips ---------- */
  steps(b,ch){
    const c=b.chapters[ch], pairs=pairsOf(b,ch), have=new Set(S.vocab.map(v=>(v.text||"").toLowerCase()));
    const st=[];
    if(ch>0&&(!c.prep||c.prep.recall.length)) st.push({id:"st-recall",label:"回顾上一章",done:!!(c.prep&&c.prep.recall.length&&Object.keys(c.recallSel||{}).length>=c.prep.recall.length)});
    st.push({id:"st-focus",label:"带着问题读",done:!!c.prep});
    if(!cjk(b.la)) st.push({id:"kwp",label:"重点词",done:!!(c.keys&&c.keys.every(k=>have.has((k.base||k.form).toLowerCase())))});
    if(pairs.length>=12) st.push({id:"st-mid",label:"中途停一下",done:!!(c.mid||"").trim()});
    st.push({id:"st-sum",label:"自己总结",done:!!c.aiSum});
    st.push({id:"st-quote",label:"打动我的一句",done:!!(c.quoteWhy||"").trim()});
    st.push({id:"st-think",label:"思考题",done:!!(c.qs&&c.qs.length&&c.qs.every((q,i)=>q.type==="mc"?(c.mcSel||{})[i]!=null:((c.ans||{})[i]||"").trim()))});
    st.push({id:"st-retell",label:"英文复述（可选）",done:!!c.retellFb,opt:true});
    return st;
  },
  flowHTML(b,ch){
    if(b.sample) return "";
    const st=this.steps(b,ch), req=st.filter(x=>!x.opt), n=req.filter(x=>x.done).length, next=st.find(x=>!x.done);
    return `<div class="flow"><span class="fl">本章 ${n}/${req.length}</span>${st.map(x=>`<button data-go="${x.id}" class="${x.done?"done":x===next?"next":""}">${x.done?"✓ ":x===next?"下一步：":""}${x.label}</button>`).join("")}</div>`;
  },

  /* ---------- after reading ---------- */
  afterHTML(b,ch){
    if(b.sample) return "";
    const c=b.chapters[ch], key=b.id+":"+ch, from=LANGS[b.la].name, fromCn={en:"英文",ru:"俄文",zh:"中文",fr:"法文",de:"德文",ja:"日文",es:"西班牙文"}[b.la]||from;
    const sumSt=this.running[key+":sum"], retSt=this.running[key+":retell"], qSt=QS.running[key];
    const marks=Object.keys(c.marks||{}).map(Number).sort((x,y)=>x-y).slice(0,6), pairs=pairsOf(b,ch);
    let think;
    if(qSt&&qSt.err) think=`<div class="mtbar err"><span>思考题没生成：${esc(qSt.err)}</span><button class="btn" id="qGo">重试</button></div>`;
    else if(qSt) think=`<div class="mtbar"><span>正在出题…</span></div>`;
    else if(!c.qs) think=llmReady()?`<div class="mtbar"><span>3 道选择题 + 3 道开放题。</span><button class="btn primary" id="qGo">生成思考题</button></div>`:`<p class="note">在“阅读设置”里填好 API Key 后可以生成思考题。</p>`;
    else{
      const mc=[],open=[]; c.qs.forEach((q,i)=>(q.type==="mc"?mc:open).push(i));
      think=(mc.length?this.mcHTML("t",mc.map(i=>c.qs[i]),Object.fromEntries(mc.map((i,j)=>[j,(c.mcSel||{})[i]]).filter(x=>x[1]!=null))).replace(/data-mc="t:(\d+):/g,(m0,j)=>`data-mc="t:${mc[+j]}:`):"")+
      open.map((i,j)=>{const q=c.qs[i],k=key+":"+i,ans=(c.ans||{})[i]||"",fb=QS.fb[k]||(c.fb||{})[i];
        return `<div class="qcard"><span class="qn">开放题 ${j+1}</span><div class="qe">${esc(q.q)}</div>${q.qz?`<div class="qz">${esc(q.qz)}</div>`:""}
        <textarea data-ans="${i}" placeholder="先写下你的想法（用英文写可以顺便练写作）">${esc(ans)}</textarea>
        <div class="qa"><button class="btn" data-ref="${i}">${QS.reveal[k]?"收起参考答案":"看参考答案"}</button><button class="btn" data-fb="${i}">AI 点评</button></div>
        ${QS.reveal[k]?`<div class="ref">${esc(q.a)}${q.az?`<div class="zh">${esc(q.az)}</div>`:""}</div>`:""}${fb?`<div class="fb">${esc(fb)}</div>`:""}</div>`}).join("")+
      `<div><button class="btn" id="qRe">换一组问题</button></div>`;
    }
    return `<section class="think"><h3>读后</h3>
      <div class="qcard" id="st-sum"><span class="qn">1 · 用自己的话总结</span><div class="note">不看书，写 3–5 句：这一章发生了什么？最重要的是什么？写完再看 AI 的总结，找出漏掉的地方。</div>
        <textarea data-f="sum" placeholder="这一章……">${esc(c.sum||"")}</textarea>
        <div class="qa"><button class="btn primary" id="sumGo" ${sumSt&&!sumSt.err?"disabled":""}>${sumSt&&!sumSt.err?"正在对比…":c.aiSum?"重新对比":"对比 AI 总结"}</button></div>
        ${sumSt&&sumSt.err?`<div class="fb">${esc(sumSt.err)}</div>`:""}
        ${c.aiSum?`${c.aiSum.miss?`<div class="fb"><b>你可以补充：</b>${esc(c.aiSum.miss)}</div>`:""}<div class="ref">${esc(c.aiSum.en)}${c.aiSum.zh?`<div class="zh">${esc(c.aiSum.zh)}</div>`:""}</div>`:""}
      </div>
      <div class="qcard" id="st-quote"><span class="qn">2 · 打动你的一句话</span>
        ${marks.length||(c.hls||[]).length?`<div class="note">从你的划线和高亮里选：</div><div class="picks">${marks.map(i=>`<button data-pick="${i}">${esc((pairs[i]||{}).a||"")}</button>`).join("")}${(c.hls||[]).slice(0,6).map((h,j)=>`<button data-pickh="${j}">${esc(h.text)}</button>`).join("")}</div>`:`<div class="note">读的时候点句子 → “划线”，这里就能直接选。也可以自己粘贴。</div>`}
        <textarea data-f="quote" placeholder="那句话" style="min-height:64px">${esc(c.quote||"")}</textarea>
        <textarea data-f="quoteWhy" placeholder="为什么打动你？它让你想到了什么？">${esc(c.quoteWhy||"")}</textarea>
      </div>
      <div id="st-think" style="display:flex;flex-direction:column;gap:12px"><span class="qn" style="font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--jade)">3 · 思考题</span>${think}</div>
      <div class="qcard" id="st-retell"><span class="qn">4 · 用${fromCn}复述（可选）</span><div class="note">用 5–8 句${fromCn}讲这一章，AI 帮你改表达。最好用上几个本章重点词。也可以点键盘上的麦克风说出来。</div>
        <textarea data-f="retell" placeholder="In this chapter...">${esc(c.retell||"")}</textarea>
        <div class="qa"><button class="btn" id="retellGo" ${retSt&&!retSt.err?"disabled":""}>${retSt&&!retSt.err?"正在修改…":"AI 改"+fromCn}</button></div>
        ${retSt&&retSt.err?`<div class="fb">${esc(retSt.err)}</div>`:""}${c.retellFb?`<div class="fb">${esc(c.retellFb)}</div>`:""}
      </div>
    </section>`;
  },
  async genQs(bk,ch){
    const key=bk.id+":"+ch; if(QS.running[key]&&!QS.running[key].err) return;
    const c=bk.chapters[ch], from=LANGS[bk.la].name, to=LANGS[this.to(bk)].name;
    QS.running[key]={err:""}; keepScroll(render);
    const sys=`You are a thoughtful literature teacher. Based on this chapter, write 3 multiple-choice questions and then 3 open questions.
Multiple-choice: 4 options, one correct. ${this.mcLevel()}
Open: themes, characters' motives and feelings, symbolism, the author's techniques. The last open question must ask the reader to connect the chapter to today's world or their own life.
Output only these lines.
Each multiple-choice question:
MC|question in ${from}
MCZ|question in ${to}
O|option in ${from} (exactly 4 lines)
ANS|correct letter A-D
EXP|why, in ${to}, 1–2 sentences
Each open question:
Q|question in ${from}
QZ|question in ${to}
A|reference answer in ${from}, 3–5 sentences, pointing to evidence in the chapter
AZ|the reference answer in ${to}`;
    try{
      const text=await llm([{role:"system",content:sys},{role:"user",content:c.a.slice(0,30000)}],3500,.8);
      const qs=[]; let cur=null;
      this.lines(text).forEach(([k,v])=>{
        if(k==="MC"){cur={type:"mc",q:v,qz:"",opts:[],ans:0,exp:""};qs.push(cur)}
        else if(k==="Q"){cur={type:"open",q:v,qz:"",a:"",az:""};qs.push(cur)}
        else if(!cur) return;
        else if(k==="MCZ"||k==="QZ") cur.qz=v; else if(k==="O") cur.opts.push(v); else if(k==="ANS") cur.ans=this.letter(v);
        else if(k==="EXP") cur.exp=v; else if(k==="A") cur.a=v; else if(k==="AZ") cur.az=v;});
      const ok=qs.filter(q=>q.type==="open"||q.opts.length>=2);
      if(!ok.length) throw new Error("没有拿到问题，请重试");
      c.qs=ok; c.mcSel={}; c.ans={}; c.fb={}; await DB.put(bk); delete QS.running[key];
    }catch(e){QS.running[key].err=e.message||String(e)}
    if(this.here(bk,ch)) keepScroll(render);
  },
  async genSum(bk,ch){
    const key=bk.id+":"+ch+":sum", c=bk.chapters[ch], from=LANGS[bk.la].name, toC=this.to(bk), to=LANGS[toC].name, mine=(c.sum||"").trim();
    if(this.running[key]&&!this.running[key].err) return;
    this.running[key]={err:""}; keepScroll(render);
    const sys=`Summarize this chapter for a language learner. Output exactly these lines and nothing else:
EN|the summary in ${from}, 4–6 sentences on one line
ZH|the same summary in ${to}, on one line
MISS|${mine?`in ${to}, compare with the learner's own summary below and name 1–3 important points they missed or got wrong; if nothing important is missing, say what they did well`:"none"}`;
    try{
      const text=await llm([{role:"system",content:sys},{role:"user",content:c.a.slice(0,30000)+(mine?"\n\nLEARNER'S SUMMARY:\n"+mine:"")}],1500,.6);
      const o={}; this.lines(text).forEach(([k,v])=>o[k]=v);
      if(!o.EN&&!o.ZH) throw new Error("没有拿到总结，请重试");
      c.aiSum={en:o.EN||"",zh:o.ZH||"",miss:mine&&o.MISS&&o.MISS!=="none"?o.MISS:""};
      await DB.put(bk); delete this.running[key];
      addVocab({kind:"idea",lang:"idea",seen:true,text:`《${bk.title}》${chName(bk,ch)||""}：这一章讲了什么？`,mean:mine,ctx:c.aiSum.zh||c.aiSum.en,book:bk.title}); save();
    }catch(e){this.running[key].err=e.message||String(e)}
    if(this.here(bk,ch)) keepScroll(render);
  },
  async genRetell(bk,ch){
    const key=bk.id+":"+ch+":retell", c=bk.chapters[ch], mine=(c.retell||"").trim(), from=LANGS[bk.la].name, to=LANGS[this.to(bk)].name;
    if(!mine){toast("先写下你的复述");return}
    this.running[key]={err:""}; keepScroll(render);
    const sys=`You are a warm ${from} writing coach for a C1 learner who retold a chapter of a book in ${from}. Reply in ${to}, plain text, no markdown, under 220 words:
1) up to 5 corrections or more natural phrasings, each as "原句 → 修改（简短说明）";
2) then "更好的版本：" followed by an improved version of their whole retelling in ${from}, keeping their ideas.`;
    try{c.retellFb=(await llm([{role:"system",content:sys},{role:"user",content:mine}],900,.6)).trim();await DB.put(bk);delete this.running[key]}
    catch(e){this.running[key].err=e.message||String(e)}
    if(this.here(bk,ch)) keepScroll(render);
  },

  /* ---------- events in the reader ---------- */
  wire(b,ch,g){
    const c=b.chapters[ch];
    app.querySelectorAll("[data-f]").forEach(x=>{x.addEventListener("click",e=>e.stopPropagation());
      x.oninput=()=>{c[x.dataset.f]=x.value;this.saveSoon(b)};
      x.onblur=()=>{const f=x.dataset.f;if((f==="mid"||f==="quoteWhy")&&x.value.trim()){const fl=app.querySelector(".flow");if(fl)fl.outerHTML=this.flowHTML(b,ch),this.wireFlow()}}});
    this.wireFlow();
    if(g("prepGo")) g("prepGo").onclick=()=>this.genPrep(b,ch);
    app.querySelectorAll("[data-mc]").forEach(x=>x.onclick=e=>{e.stopPropagation();const [p,i,oi]=x.dataset.mc.split(":");
      if(p==="r"){c.recallSel=c.recallSel||{};if(c.recallSel[i]!=null)return;c.recallSel[i]=+oi}
      else{c.mcSel=c.mcSel||{};if(c.mcSel[i]!=null)return;c.mcSel[i]=+oi}
      DB.put(b);keepScroll(render)});
    app.querySelectorAll("[data-pick]").forEach(x=>x.onclick=()=>{c.quote=(pairsOf(b,ch)[+x.dataset.pick]||{}).a||"";DB.put(b);keepScroll(render)});
    app.querySelectorAll("[data-pickh]").forEach(x=>x.onclick=()=>{c.quote=((c.hls||[])[+x.dataset.pickh]||{}).text||"";DB.put(b);keepScroll(render)});
    if(g("sumGo")) g("sumGo").onclick=()=>this.genSum(b,ch);
    if(g("retellGo")) g("retellGo").onclick=()=>this.genRetell(b,ch);
  },
  preOpen(b,ch){const p=S.pos[b.id]; return !(p&&p.ch===ch&&p.i>=0)},
  wireFlow(){app.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>{const t=document.getElementById(x.dataset.go)||app.querySelector("."+x.dataset.go);
    if(t){const d=t.closest("details.pre"); if(d) d.open=true; t.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});if(t.tagName==="DETAILS")t.open=true}
    else toast(x.dataset.go==="kwp"?"重点词还在生成，或需要先填 API Key":"这一步还没准备好")})},

  /* ---------- review cards: idea cards and "use it" cards ---------- */
  grade(v,ok){ SB.grade(v,ok?"know":"no") },
  reviewCard(el,head,list,k,v){
    const sh=view.sheet, mode=(sh.modes||{})[v.id];

      el.innerHTML=`<div class="sheet wide">${head("今日学习")}<div class="body" style="gap:18px">${SB.topHTML(sh)}
        <div class="vitem" style="padding:22px 20px;gap:12px"><span class="tag">内容回顾</span><div style="font-size:19px;font-weight:600;line-height:1.5">${esc(v.text)}</div>
        ${sh.show?`${v.mean?`<div class="ctx"><b>你的总结</b><br>${esc(v.mean)}</div>`:""}<div class="ctx"><b>AI 总结</b><br>${esc(v.ctx||"")}</div>`:`<div class="note">先在心里说一遍，再点“看答案”。</div>`}</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${sh.show?`<button class="btn" id="rvAgain">记不清</button><button class="btn primary" id="rvOk">记得</button>`:`<button class="btn primary" id="rvShow">看答案</button>`}</div></div></div>`;
    }else{
      el.innerHTML=`<div class="sheet wide">${head("今日学习")}<div class="body" style="gap:16px">${SB.topHTML(sh)}
        <div class="vitem" style="padding:22px 20px;gap:10px"><span class="tag">造句练习</span>
          <div class="w" style="font-size:28px;cursor:default">${esc(v.text)}</div>
          ${v.mean?`<div style="color:var(--jade)">${esc(v.mean)}</div>`:""}${v.col?`<div class="ctx"><b>搭配</b> ${esc(v.col)}</div>`:""}
          <div class="note">用 <b>${esc(v.text)}</b> 写一句和你自己生活有关的${({en:"英文",ru:"俄文",zh:"中文"})[lang]||from}句子（今天做的事、最近的想法都可以）。</div>
          <textarea id="useIn" style="min-height:80px;font-size:16px" placeholder="...">${esc(sh.draft||"")}</textarea>
          ${sh.useFb?`<div class="fb" style="white-space:pre-wrap;border-radius:10px;padding:12px;border:1px dashed var(--jade);background:var(--paper);line-height:1.6">${esc(sh.useFb)}</div>`:""}
          ${sh.show&&v.ctx?`<div class="ctx"><b>书里的原句</b> ${esc(v.ctx)}</div>`:""}
        </div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn" id="rvSay">${ic("speakA")}朗读</button>
          <button class="btn" id="useChk">AI 检查</button>
          <button class="btn" id="rvAgain">还不会用</button><button class="btn primary" id="rvOk">会用了</button>
        </div></div></div>`;
    }
    document.body.appendChild(el);
    const q=id=>el.querySelector("#"+id);
    if(q("rvShow")) q("rvShow").onclick=()=>{sh.show=true;renderSheet()};

    if(q("rvOk")) q("rvOk").onclick=()=>this.grade(v,true);
    if(q("rvSay")) q("rvSay").onclick=()=>{synth&&synth.cancel();utter(v.text,lang)};
    if(q("useIn")) q("useIn").oninput=e=>{sh.draft=e.target.value};
    if(q("useChk")) q("useChk").onclick=async()=>{const t=(sh.draft||"").trim(); if(!t){toast("先写一句");return}
      if(!llmReady()){toast("需要先在阅读设置里填 API Key");return}
      sh.useFb="AI 正在检查…"; sh.show=true; renderSheet();
      const toName=LANGS[(S.settings.mtTo&&S.settings.mtTo!==lang)?S.settings.mtTo:"zh"].name;
      try{sh.useFb=(await llm([{role:"system",content:`A C1 learner wrote a ${from} sentence using the word "${v.text}" (${v.mean||""}). Reply in ${toName}, plain text, three short lines only:
判断：对 / 基本对 / 不对 + one short reason
更自然：a more natural version of their sentence in ${from}
再一句：one more everyday example using the word in ${from}`},{role:"user",content:t}],300,.6)).trim()}
      catch(e){sh.useFb="检查失败："+e.message}

  /* ---------- extra sheets ---------- */
  sheet(t,el,head){
    if(t==="note") return this.noteSheet(el,head);
    if(t==="notes") return this.notesSheet(el,head);
    if(t==="teach") return this.teachSheet(el,head);
    if(t==="diary") return this.diarySheet(el,head);
    return false;
  },
  noteSheet(el,head){
    const b=view.book, ch=view.ch, c=b.chapters[ch], i=view.sheet.i, p=pairsOf(b,ch)[i]||{};
    el.innerHTML=`<div class="sheet">${head("批注")}<div class="body">
      <div class="ctx" style="font-family:var(--f-read);font-size:16px;line-height:1.6">${esc(p.a||"")}</div>
      <textarea id="noteIn" placeholder="你的想法、疑问，或者它让你想到了什么">${esc((c.marks||{})[i]||"")}</textarea>
      <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">${(c.marks||{})[i]!=null||(c.hls||[]).some(h=>h.i===i)?`<button class="btn" id="noteDel" style="color:var(--danger);border-color:var(--danger)">删除划线和批注</button>`:""}<button class="btn primary" id="noteSave">保存</button></div>
    </div></div>`;
    document.body.appendChild(el);
    el.querySelector("#noteSave").onclick=()=>{c.marks=c.marks||{};c.marks[i]=el.querySelector("#noteIn").value.trim();DB.put(b);closeSheet();keepScroll(render)};
    const d=el.querySelector("#noteDel"); if(d) d.onclick=()=>{delete c.marks[i];c.hls=(c.hls||[]).filter(h=>h.i!==i);DB.put(b);closeSheet();keepScroll(render)};
    el.querySelectorAll("[data-close]").forEach(x=>x.onclick=closeSheet);
    setTimeout(()=>{const n=el.querySelector("#noteIn");n&&n.focus()},50);
    return true;
  },
  notesText(b){
    const out=[`《${b.title}》读书笔记`,""];
    b.chapters.forEach((c,ch)=>{
      const parts=[], pairs=(c.marks&&Object.keys(c.marks).length)?pairsOf(b,ch):[];
      if(c.prep&&c.prep.focus) parts.push(["带着的问题",c.prep.focus]);
      if((c.mid||"").trim()) parts.push(["读到一半",c.mid]);
      Object.keys(c.marks||{}).map(Number).sort((x,y)=>x-y).forEach(i=>parts.push(["划线",(pairsOf(b,ch)[i]||{}).a+(c.marks[i]?"\n→ "+c.marks[i]:"")]));
      (c.hls||[]).slice().sort((x,y)=>x.i-y.i||x.start-y.start).forEach(h=>parts.push(["高亮",h.text]));
      if((c.sum||"").trim()) parts.push(["我的总结",c.sum]);
      if(c.aiSum) parts.push(["AI 总结",c.aiSum.zh||c.aiSum.en]);
      if((c.quote||"").trim()) parts.push(["打动我的一句",c.quote+((c.quoteWhy||"").trim()?"\n→ "+c.quoteWhy:"")]);
      (c.qs||[]).forEach((q,i)=>{if(q.type==="open"&&((c.ans||{})[i]||"").trim()) parts.push(["思考："+q.q,c.ans[i]])});
      if((c.retell||"").trim()) parts.push(["我的复述",c.retell]);
      if(parts.length){out.push("## "+(chName(b,ch)||`第 ${ch+1} 章`));parts.forEach(([k,v])=>out.push(`【${k}】${v}`));out.push("")}
    });
    return out.join("\n");
  },
  notesSheet(el,head){
    const b=view.book, txt=this.notesText(b), body=txt.split("\n").slice(2);
    const html=body.length&&body.some(l=>l.trim())?body.map(l=>l.startsWith("## ")?`<h4>${esc(l.slice(3))}</h4>`:l.startsWith("【")?`<div class="nbi"><span class="nbl">${esc(l.slice(1,l.indexOf("】")))}</span>${esc(l.slice(l.indexOf("】")+1))}</div>`:l.trim()?`<div class="nbi">${esc(l)}</div>`:"").join(""):`<p class="empty">还没有笔记。读的时候划线、批注，读完写总结和思考，这里会自动整理成一本读书笔记。</p>`;
    el.innerHTML=`<div class="sheet wide">${head("读书笔记",`<button class="ibtn" id="nbCopy" title="复制全部">${ic("copy")}</button>`)}<div class="body">

/* ---------- highlights: whole sentence or any selected words ---------- */
const HL={
  sel(){const sel=window.getSelection(); if(!sel||sel.isCollapsed||!sel.rangeCount) return null;
    const r=sel.getRangeAt(0), n=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;
    const cell=n&&n.closest(".s"), row=n&&n.closest(".row"); if(!cell||!row||!cell.contains(r.endContainer)) return null;
    const pre=document.createRange(); pre.selectNodeContents(cell); pre.setEnd(r.startContainer,r.startOffset);
    const start=pre.toString().length, text=r.toString(); if(!text.trim()) return null;
    const orig=cell.classList.contains(S.settings.swap?"b":"a");
    return {i:+row.dataset.i,which:orig?"orig":"tr",start,end:start+text.length,text:text.trim()}},
  markClick(b,ch){const c=b.chapters[ch], si=this.sel();
    if(si){c.hls=c.hls||[]; c.hls.push(si); window.getSelection().removeAllRanges(); DB.put(b); keepScroll(render); toast("已高亮"); return}
    const i=view.active; if(i<0) return; c.marks=c.marks||{};
    const has=c.marks[i]!=null||(c.hls||[]).some(h=>h.i===i);
    if(has){delete c.marks[i]; c.hls=(c.hls||[]).filter(h=>h.i!==i)} else c.marks[i]="";
    DB.put(b); keepScroll(render)},
  apply(b,ch){
    if(!(window.CSS&&CSS.highlights&&window.Highlight)) return;
    const hl=new Highlight(), c=b.chapters[ch];
    (c.hls||[]).forEach(h=>{
      const cls=(h.which==="orig")!==!!S.settings.swap?"a":"b";
      const cell=app.querySelector(`.row[data-i="${h.i}"] .s.${cls}`); if(!cell) return;
      const w=document.createTreeWalker(cell,NodeFilter.SHOW_TEXT); let pos=0, sN=null, sO=0, eN=null, eO=0, nd;
      while((nd=w.nextNode())){const L=nd.nodeValue.length;
        if(!sN&&h.start<=pos+L){sN=nd;sO=h.start-pos}
        if(sN&&h.end<=pos+L){eN=nd;eO=h.end-pos;break}
        pos+=L}
      if(sN&&eN){const r=document.createRange(); try{r.setStart(sN,sO);r.setEnd(eN,eO);hl.add(r)}catch(e){}}
    });
    CSS.highlights.set("duodu",hl);
  },
  updateBar(){
    const btn=document.getElementById("markBtn"); if(!btn||view.name!=="reader") return;
    const c=view.book.chapters[view.ch], si=this.sel(), i=view.active;
    const has=i>=0&&((c.marks||{})[i]!=null||(c.hls||[]).some(h=>h.i===i));
    btn.querySelector("span").textContent=si?"高亮所选":has?"取消划线":"划线";
    btn.classList.toggle("hot",!!si);
  }
};
document.addEventListener("selectionchange",()=>{
  if(view.name!=="reader") return;
  const si=HL.sel();

    view.active=si.i; S.pos[view.book.id]={ch:view.ch,i:si.i,t:Date.now()}; save();

});

/* ---------- daily word study (扇贝-style) ---------- */
const SB={
  ipa(v){const m=(v.mean||"").match(/\/[^/]{1,40}\//);return m?m[0]:""},
  meanText(v){return (v.mean||"").replace(this.ipa(v),"").trim()},
  learnedToday(){const d=FLOW.dayKey();return S.newDay&&S.newDay.date===d?S.newDay.n:0},
  plan(){const goal=+(S.settings.newGoal||10), extra=(S.newDay&&S.newDay.date===FLOW.dayKey()&&S.newDay.extra)||0;
    const fresh=S.vocab.filter(v=>!v.seen&&v.kind!=="idea"&&!isMastered(v)).reverse();
    return {review:dueList(),fresh:fresh.slice(0,Math.max(0,goal+extra-this.learnedToday())),freshAll:fresh.length}},
  streak(){const days=new Set((S.study||{}).days||[]);let n=0;const d=new Date();d.setHours(12);
    if(!days.has(FLOW.dayKey())) d.setDate(d.getDate()-1);
    for(;;){const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;if(!days.has(k))break;n++;d.setDate(d.getDate()-1)}
    return n},
  markStudy(){S.study=S.study||{days:[]};const k=FLOW.dayKey();if(!S.study.days.includes(k))S.study.days.push(k);S.study.days=S.study.days.slice(-400)},
  start(){
    const p=this.plan(); const rv=shuffle(p.review), fr=p.fresh.slice(); const list=[];
    while(rv.length||fr.length){if(rv.length)list.push(rv.shift());if(rv.length)list.push(rv.shift());if(fr.length)list.push(fr.shift())}
    if(!list.length){toast("今天的任务都完成了");return}
    const modes={}; list.forEach(v=>{modes[v.id]=(v.kind==="word"&&v.seen&&v.level&&!/文学/.test(v.level)&&(v.stage||0)>=1&&Math.random()<.35)?"use":"see"});
    view.sheet={type:"review",list,k:0,modes,phase:"front",ans:null,hint:false,rep:{},stats:{fresh:0,rev:0,t0:Date.now()}};
    renderSheet();
  },
  grade(v,res){
    const sh=view.sheet, it=S.vocab.find(x=>x.id===v.id), first=!sh.rep[v.id];
    if(it){
      if(first){ if(!it.seen){it.seen=true;const d=FLOW.dayKey();S.newDay=S.newDay&&S.newDay.date===d?S.newDay:{date:d,n:0,extra:0};S.newDay.n++;sh.stats.fresh++} else sh.stats.rev++ }
      if(res==="easy"){it.stage=INTERVALS.length;it.due=0}
      else if(res==="know"){ if(first){it.stage=(it.stage||0)+1;it.due=isMastered(it)?0:today0()+INTERVALS[it.stage-1]*DAY} }
      else if(res==="vague"){ if(first){it.stage=Math.max(0,(it.stage||0)-1)} it.due=today0()+DAY }
      else { it.stage=0; it.due=today0()+DAY }
    }
    if(it) it.u=Date.now();
    sh.rep[v.id]=(sh.rep[v.id]||0)+1;
    if((res==="no"&&sh.rep[v.id]<=3)||(res==="vague"&&sh.rep[v.id]<=1)){
      const at=Math.min(sh.list.length,sh.k+(res==="no"?4:6)); sh.list.splice(at,0,v)}
    this.markStudy(); save();
    sh.k++; sh.phase="front"; sh.ans=null; sh.hint=false; sh.useFb=""; sh.draft=""; sh.show=false; renderSheet();
  },
  hintHTML(v){if(!v.ctx) return "";const w=esc(v.text), re=new RegExp("("+v.text.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").slice(0,5)+"[\\w'’-]*)","i");
    return esc(v.ctx).replace(re,"<u>$1</u>")},
  topHTML(sh){const left=sh.list.length-sh.k, pct=Math.round(sh.k/Math.max(1,sh.list.length)*100);
    return `<div class="sbtop"><div class="sbprog"><i style="width:${pct}%"></i></div><div class="sbstat"><span>新学 ${sh.stats.fresh}</span><span>复习 ${sh.stats.rev}</span><span class="spacer"></span><span>还剩 ${left}</span></div></div>`},
  render(el,head){
    const sh=view.sheet, list=sh.list, k=sh.k, v=list[k];
    if(!v) return this.done(el,head);
    if(FLOW.reviewCard(el,head,list,k,v)) return;
    const lang=LANGS[v.lang]?v.lang:"en", ipa=this.ipa(v);
    let body;
    if(sh.phase==="front"){
      body=`${this.topHTML(sh)}

        <div class="sbword">${esc(v.text)}</div>
        ${ipa?`<div class="sbipa">${esc(ipa)}</div>`:""}
        <button class="ibtn" id="sbSay" aria-label="发音">${ic("speakA")}发音</button>
        ${v.ctx?(sh.hint?`<div class="sbhint">${this.hintHTML(v)}</div>`:`<button class="linkbtn" id="sbHint">看书里的句子提示</button>`):""}
      </div>
      <div class="sbbtns"><button class="no" data-a="no">不认识</button><button class="vague" data-a="vague">模糊</button><button class="know" data-a="know">认识</button></div>
      <div style="text-align:center"><button class="linkbtn" id="sbEasy">太简单，以后不用再背</button></div>`;
    }else{
      body=`${this.topHTML(sh)}
      <div class="sbdet">
        <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><span class="sbword" style="font-size:34px">${esc(v.text)}</span>${ipa?`<span class="sbipa">${esc(ipa)}</span>`:""}<button class="ibtn" id="sbSay" aria-label="发音">${ic("speakA")}</button>${v.level?`<span class="lv ${/文学/.test(v.level)?"":"use"}">${esc(v.level)}</span>`:""}</div>

        ${v.col?`<div class="blk"><b>常用搭配</b>${esc(v.col)}</div>`:""}
        ${v.ex?`<div class="blk"><b>例句</b>${esc(v.ex)}${v.exTr?`<div class="tr">${esc(v.exTr)}</div>`:""}</div>`:""}
        ${v.ctx?`<div class="blk"><b>书里的原句</b>${this.hintHTML(v)}${v.tr?`<div class="tr">${esc(v.tr)}</div>`:""}</div>`:""}
      </div>
      ${sh.ans==="know"?`<div class="sbbtns" style="grid-template-columns:1fr 2fr"><button class="no" id="sbWrong">记错了</button><button class="know" id="sbNext">下一个</button></div>`:`<button class="sbnext" id="sbNext">下一个</button>`}`;
    }
    el.innerHTML=`<div class="sheet wide">${head("今日学习")}<div class="body" style="gap:14px">${body}</div></div>`;
    document.body.appendChild(el);
    const q=id=>el.querySelector("#"+id);

    el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{sh.ans=b.dataset.a;sh.phase="back";renderSheet()});

    if(q("sbWrong")) q("sbWrong").onclick=()=>this.grade(v,"no");

  },
  done(el,head){
    const sh=view.sheet, mins=Math.max(1,Math.round((Date.now()-sh.stats.t0)/60000)), p=this.plan(), st=this.streak();
    const days=new Set((S.study||{}).days||[]), cells=[], d=new Date(); d.setHours(12); d.setDate(d.getDate()-27);
    for(let i=0;i<28;i++){const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;cells.push(`<span class="${days.has(key)?"on":""} ${i===27?"today":""}" title="${key}"></span>`);d.setDate(d.getDate()+1)}
    el.innerHTML=`<div class="sheet wide">${head("今日学习完成")}<div class="body" style="gap:18px">
      <div class="bigstats"><div><b>${sh.stats.fresh}</b><span>新学</span></div><div><b>${sh.stats.rev}</b><span>复习</span></div><div><b>${st}</b><span>连续天数</span></div></div>
      <p class="note">用时约 ${mins} 分钟。认识的词会在 1、3、7、15、30、60 天后再出现；不认识和模糊的词明天还会出现。</p>
      <div><div class="note" style="margin-bottom:8px">最近 4 周</div><div class="cal">${cells.join("")}</div></div>

    document.body.appendChild(el);
    const q=id=>el.querySelector("#"+id);
    if(q("sbMore")) q("sbMore").onclick=()=>{const dd=FLOW.dayKey();S.newDay=S.newDay&&S.newDay.date===dd?S.newDay:{date:dd,n:0,extra:0};S.newDay.extra=(S.newDay.extra||0)+10;save();this.start()};
    q("sbDiary").onclick=()=>openSheet("diary");
    q("sbList").onclick=()=>openSheet("vocab");
